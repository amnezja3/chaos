<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CHAOS social card source — 1200 × 630</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #020c09; color: #e5fff0; font-family: Arial, sans-serif; }
main { position: relative; height: 100%; padding: 64px 74px; background: radial-gradient(ellipse at 95% 10%, #08735370, transparent 62%), repeating-linear-gradient(0deg, transparent 0 39px, #22ff9910 39px 40px), repeating-linear-gradient(90deg, transparent 0 39px, #22ff9910 39px 40px); }
main::after { content: ''; position: absolute; inset: 24px; border: 1px solid #26df8360; pointer-events: none; }
.top { font: 18px monospace; letter-spacing: 4px; color: #58ffae; display: flex; justify-content: space-between; }
h1 { margin: 46px 0 0; font-size: 142px; letter-spacing: 12px; line-height: 1; color: #62ff9e; }
.name { margin: 15px 0 38px; font: 20px monospace; letter-spacing: 2px; }
.tagline { font-size: 37px; line-height: 1.25; margin: 0; max-width: 850px; }
footer { margin-top: 40px; border-top: 1px solid #26df8360; padding-top: 22px; display: flex; justify-content: space-between; font: 18px monospace; color: #87b7a2; }
footer strong { color: #62ff9e; }
</style>
<main>
  <div class="top"><span>GHOST SYSTEM // ONLINE</span><span>CHAOS.RE</span></div>
  <h1>CHAOS</h1>
  <p class="name">CYBER HACKING ADVENTURE OF SENSES</p>
  <p class="tagline">Hack the digital senses<br>of the modern world.</p>
  <footer><span>SCAN · CREATE · HACK · TRADE</span><strong>ENTER THE WORLD →</strong></footer>
</main>
</html>
