  - generic [ref=e40]:
    - heading "1. Bezpieczeństwo komunikacji — zakres przygotowany w 157.8" [level=2] [ref=e41]
    - paragraph [ref=e42]: Moduł ochrony komunikacji jest wdrażany niezależnie od polityki wieku. Po jego aktywacji przetwarzamy relacje blokad, zaproszenia, liczniki ograniczające nadużycia oraz zgłoszenia i decyzje moderacyjne. Zgłoszenie może zawierać kopię wskazanej treści i opis zgłaszającego; nie udostępniamy drugiej stronie tożsamości zgłaszającego ani jego opisu. Administratorzy uprawnieni do moderacji mają dostęp do dowodów. Usunięcie konta usuwa jego bieżące relacje kontaktowe i odłącza identyfikator od zgłoszeń; treść dowodowa może nadal zawierać dane osobowe. Podstawy i okresy jej dalszego przechowywania oraz procedura usuwania muszą być zatwierdzone przed uruchomieniem modułu. Nie deklarujemy automatycznej anonimizacji tych treści.
  - generic [ref=e43]:
    - heading "2. Administrator i kontakt" [level=2] [ref=e44]
    - paragraph [ref=e45]: "Administratorem danych osobowych w CHAOS — Cyber Hacking Adventure Of Senses — jest Michał Cezary Jankiewicz, prowadzący grę jako osoba prywatna. Adres: ul. Relaksowa 5 lok. 1, 27-400 Ostrowiec Świętokrzyski, Polska. Kontakt w sprawach konta, ochrony danych i realizacji praw: year2108@chaos.re. Polityka dotyczy serwisu chaos.re i jego instalowanej aplikacji internetowej (PWA)."
  - generic [ref=e46]:
    - heading "3. Dane konta i rozgrywki" [level=2] [ref=e47]
    - paragraph [ref=e48]: CHAOS przetwarza identyfikator konta, login lub nick, adres e-mail, wybrany klan, profesję, avatar, postęp i działania w grze oraz treści przesyłane przez gracza. Nick, profil, publikacje i działania we wspólnym świecie mogą być widoczne dla innych graczy. Nie publikuj danych, których nie chcesz udostępniać.
  - generic [ref=e49]:
    - heading "4. Logowanie i zewnętrzni dostawcy" [level=2] [ref=e50]
    - paragraph [ref=e51]: Możesz korzystać z lokalnego konta lub dostępnych metod Google, GitHub, Discord i Steam. Przy logowaniu zewnętrznym otrzymujemy identyfikator u dostawcy oraz, jeśli jest dostępny, adres e-mail i informację o jego potwierdzeniu. CHAOS nie otrzymuje hasła do konta dostawcy. Hasła lokalne są przechowywane jako skróty kryptograficzne. Sam zgodny adres e-mail nie powoduje automatycznego połączenia kont.
  - generic [ref=e52]:
    - 'heading "5. Google: zakres i wykorzystanie danych" [level=2] [ref=e53]'
    - paragraph [ref=e54]: Logowanie przez Google jest opcjonalne. Po wybraniu tej metody przechodzisz na stronę Google; CHAOS prosi wyłącznie o zakresy openid i email. Z podpisanego tokenu odczytujemy identyfikator konta Google (sub), adres e-mail i informację o jego potwierdzeniu (email_verified). Zapisujemy te dane oraz daty powiązania i użycia metody w bazie kont CHAOS. Służą utworzeniu konta, logowaniu i powiązaniu Google z istniejącym kontem na Twoje żądanie. Potwierdzony e-mail może zostać adresem bezpieczeństwa konta, używanym do kodów i potwierdzeń. Sam zgodny adres e-mail nie łączy automatycznie dwóch kont. Nie otrzymujemy hasła Google, nie pobieramy zdjęcia profilowego i nie żądamy dostępu do Gmaila, Dysku, Kontaktów ani Kalendarza.
  - generic [ref=e55]:
    - 'heading "6. Google: zabezpieczenia i odbiorcy danych" [level=2] [ref=e56]'
    - paragraph [ref=e57]: Wymiana kodu logowania i sprawdzenie podpisanego tokenu odbywają się po stronie serwera przez HTTPS. Tokeny dostępu i odświeżania nie są zapisywane w tabelach Identity Gateway. Powiązanie Google nie jest publiczną częścią profilu gracza. Dane konta są przetwarzane na infrastrukturze serwerowej CHAOS; adres odbiorcy i treść wiadomości bezpieczeństwa trafiają do usługi pocztowej cyber_Folks oraz do dostawcy poczty odbiorcy podczas doręczenia. Google obsługuje swoją część logowania i otrzymuje dane niezbędne do autoryzacji. Korzystanie ze strony Google podlega także polityce prywatności Google. Zakres dostępu do infrastruktury, lokalizacje i ewentualne transfery opisuje sekcja o odbiorcach; jej ustalenia produkcyjne wymagają jeszcze potwierdzenia.
  - generic [ref=e58]:
    - heading "7. Odłączenie Google i usunięcie danych" [level=2] [ref=e59]
    - paragraph [ref=e60]: W grze otwórz Ustawienia → Konto → Identity Gateway. Odłączenie Google usuwa bieżące powiązanie dostawcy; musi pozostać inna metoda logowania. Nie usuwa to konta CHAOS ani adresu e-mail zapisanego osobno jako adres bezpieczeństwa. Dostęp aplikacji możesz również cofnąć w ustawieniach połączeń z aplikacjami na swoim koncie Google; samo cofnięcie dostępu nie usuwa danych już zapisanych w CHAOS. Usunięcie konta w Identity Gateway wymaga ponownego uwierzytelnienia i usuwa bieżące powiązania oraz dane bezpieczeństwa opisane poniżej. Żądania dostępu lub usunięcia pozostałych danych możesz przesłać na year2108@chaos.re. Nie wysyłaj hasła, tokenów ani kodów logowania w takim zgłoszeniu.
  - generic [ref=e61]:
    - heading "8. Discord, GitHub i Steam" [level=2] [ref=e62]
    - paragraph [ref=e63]: "Discord używa identify i email: odpowiedź /users/@me służy odczytaniu identyfikatora, e-maila i statusu verified. GitHub używa read:user i user:email: /user oraz /user/emails służą odczytaniu identyfikatora i głównego potwierdzonego e-maila. API dostawców mogą zwracać dodatkowe pola profilu; adapter utrwala tylko wskazane dane tożsamości. Steam OpenID potwierdza SteamID; nie dostarcza e-maila, więc adres wymaga osobnego potwierdzenia w CHAOS. Użycie zewnętrznej metody jest opcjonalne. Dostawca obsługuje własną stronę logowania na swoich zasadach. Odłączenie metody w ustawieniach usuwa jej bieżące powiązanie; musi pozostać co najmniej jedna metoda logowania."
  - generic [ref=e64]:
    - heading "9. Minimalny wiek i zapis akceptacji" [level=2] [ref=e65]
    - paragraph [ref=e66]: Przygotowywana polityka CHAOS przewiduje minimalny wiek 16 lat. Mechanizm wymagający nowego oświadczenia 16+ nie został jeszcze aktywowany na produkcji. Po jego uruchomieniu zapis obejmie identyfikator użytkownika, wersję Regulaminu, czas akceptacji oraz fakt i wersję oświadczenia o wieku. Historyczne oświadczenia pozostają odrębnymi zapisami i nie są automatycznie zamieniane na nowe. Nie zbieramy w tym celu daty urodzenia, dokumentów tożsamości ani potwierdzenia wieku z Google. Logowanie Google nie stanowi weryfikacji wieku. Wprowadzenie nowej polityki i ograniczeń wymaga osobnego ogłoszenia; ten projekt nie aktywuje ich ani nie zmienia istniejących kont.
  - generic [ref=e67]:
    - heading "10. Sesje i pamięć urządzenia" [level=2] [ref=e68]
    - paragraph [ref=e69]: Cookies i pamięć przeglądarki obsługują logowanie, zabezpieczenia, język i ustawienia interfejsu. Trwała sesja ma limit 30 dni nieaktywności i 90 dni od logowania; nowe logowanie unieważnia poprzednią sesję. Wylogowanie kończy dostęp w danej sesji. Instalacja PWA jest opcjonalna i może używać osobnej pamięci, wymagając ponownego logowania.
  - generic [ref=e70]:
    - heading "11. Dane techniczne i mapa" [level=2] [ref=e71]
    - paragraph [ref=e72]: Obsługa połączeń i bezpieczeństwa może obejmować adres IP, informacje o przeglądarce, czas żądania i zdarzenia logowania. Przy tworzeniu profilu funkcja wyboru miasta startowego może przesłać publiczny adres IP do ip-api.com i otrzymać przybliżone miasto oraz współrzędne. To nie jest pomiar GPS. Obecna implementacja tego zapytania używa HTTP, co wymaga przeglądu bezpieczeństwa i minimalizacji przed finalizacją polityki. Mapa może pobierać kafelki z OpenStreetMap lub OpenTopoMap, a biblioteki mapy z unpkg.com; osadzona mapa kontaktuje się również z OpenStreetMap. Przy takim pobieraniu dostawcy otrzymują adres IP i dane żądania, w tym obszar mapy wynikający z adresów kafelków. Pozycja postaci jest daną rozgrywki, nie deklaracją rzeczywistego położenia gracza.
  - generic [ref=e73]:
    - heading "12. Pseudonimowość, analityka i reklamy" [level=2] [ref=e74]
    - paragraph [ref=e75]: W świecie gry możesz posługiwać się nickiem; nie wymagamy publicznego używania prawdziwego imienia i nazwiska. Pseudonimowość wobec graczy nie oznacza anonimowości wobec operatora, ponieważ konto może być powiązane z e-mailem, identyfikatorem logowania i zdarzeniami technicznymi. Przegląd kodu stron, skryptów i arkuszy stylów nie wykazał integracji Google Analytics, Google Tag Manager, Matomo, Plausible, PostHog, Mixpanel, Hotjar, Microsoft Clarity, Meta Pixel, Sentry ani Google Ads. Nie jest to potwierdzenie konfiguracji reverse proxy lub usług dodanych poza repozytorium. Korzystanie z resolvera DNS 1.1.1.1 nie oznacza, że CHAOS używa Cloudflare jako CDN lub proxy; takiej usługi nie potwierdzono.
  - generic [ref=e76]:
    - heading "13. Cele i podstawy przetwarzania — projekt" [level=2] [ref=e77]
    - paragraph [ref=e78]: "Proponowane podstawy do zatwierdzenia: realizacja usługi konta i rozgrywki — art. 6 ust. 1 lit. b RODO; bezpieczeństwo, zapobieganie nadużyciom i obrona roszczeń — art. 6 ust. 1 lit. f, jako uzasadniony interes operatora; obowiązki prawne — lit. c, gdy mają zastosowanie. Dane wymagane do utworzenia konta są niezbędne do udostępnienia tej usługi. Przeczytanie polityki nie oznacza zgody na marketing."
  - generic [ref=e79]:
    - heading "14. Odbiorcy i usługi zewnętrzne" [level=2] [ref=e80]
    - paragraph [ref=e81]: Dane kont i gry są przechowywane na serwerze VPS używanym przez CHAOS; jego dostawca i fizyczna lokalizacja pozostają do potwierdzenia. DNS i pocztę obsługuje cyber_Folks. Poczta transakcyjna zawiera adres odbiorcy, kody i potwierdzenia bezpieczeństwa. Wybrani dostawcy logowania to Google, GitHub, Discord i Steam. Dane otrzymywane przez usługi mapowe i ip-api.com opisano powyżej, a dane narracji przekazywane do Mistral w sekcji AI. Należy osobno potwierdzić role prawne podmiotów, lokalizacje przetwarzania oraz podstawy i zabezpieczenia ewentualnych transferów poza EOG; nie deklarujemy, że wszystkie dane pozostają w Polsce lub UE.
  - generic [ref=e82]:
    - heading "15. Narracja i systemy AI" [level=2] [ref=e83]
    - paragraph [ref=e84]: CHAOS zawiera interakcje ludzi i agentów AI. Adapter Mistral przesyła pakiet instrukcji i wiadomości związanych z generowaniem narracji do api.mistral.ai; alternatywą jest skonfigurowana Ollama. Projekcje semantyczne mogą zawierać opisy wydarzeń, etykiety podmiotów i miejsca w świecie gry. Nie oznacza to, że każda rozmowa w komunikatorze Cyberner jest wysyłana do Mistrala. Zakres innych modułów AI i ich rzeczywistych danych wejściowych, umowy, retencja po stronie dostawców i miejsca przetwarzania wymagają inwentaryzacji produkcyjnej przed finalizacją polityki. Nie deklarujemy anonimizacji wszystkich danych ani braku trenowania przez podwykonawcę bez potwierdzenia.
  - generic [ref=e85]:
    - heading "16. Oddzielenie logowania Google od narracji AI" [level=2] [ref=e86]
    - paragraph [ref=e87]: Adapter logowania Google przekazuje identyfikator i e-mail do obsługi tożsamości, a nie do adaptera generowania narracji. Narracja korzysta z opisów zdarzeń w świecie gry; mogą one zawierać nicki i inne treści wprowadzone przez graczy, dlatego nie traktujemy ich automatycznie jako danych anonimowych. Nie należy umieszczać haseł, kodów, adresów e-mail ani cudzych danych prywatnych w publicznych opisach i publikacjach. Potwierdzenie zakresu innych funkcji AI jest konieczne, zanim będzie można złożyć deklarację dotyczącą wszystkich przepływów danych w całej platformie.
  - generic [ref=e88]:
    - heading "17. Techniczny cykl życia danych Identity" [level=2] [ref=e89]
    - paragraph [ref=e90]: "Próba autoryzacji jest ważna przez 10 minut, możliwość dokończenia rejestracji przez 30 minut, a potwierdzenie uprawniające do zmiany zabezpieczeń przez 5 minut. Rozpoczęcie kolejnego procesu autoryzacji uruchamia porządkowanie wygasłych rekordów oraz usunięcie zdarzeń bezpieczeństwa Identity starszych niż 90 dni. Nie jest to gwarancja usunięcia dokładnie w chwili wygaśnięcia: bez kolejnego uruchomienia procedury rekord może pozostać w bazie. Czas ważności sesji nie wyznacza okresu przechowywania backupów ani logów serwera. Ich rzeczywiste okresy i dodatkowy harmonogram porządkowania pozostają do potwierdzenia przed publikacją finalnego dokumentu."
  - generic [ref=e91]:
    - heading "18. Okres przechowywania i usunięcie" [level=2] [ref=e92]
    - paragraph [ref=e93]: Dane profilu służą obsłudze aktywnego konta. Usunięcie konta jest trwałe; historia wspólnego świata i kopie wiadomości u odbiorców mogą pozostać. Nie oznacza to bezterminowej podstawy do zachowania danych osobowych. Operator musi przed publikacją określić okresy lub kryteria przechowywania logów, historii, identyfikatorów zabezpieczających przed nadużyciami i kopii zapasowych oraz sposób realizacji żądań usunięcia.
  - generic [ref=e94]:
    - heading "19. Co usuwa procedura konta" [level=2] [ref=e95]
    - paragraph [ref=e96]: Usunięcie konta wymaga świeżego potwierdzenia tożsamości. Procedura usuwa bieżące połączenia dostawców, ustawienia bezpieczeństwa konta, zgody, powiązane próby i kody oraz własne kopie wybranych danych gracza. Zachowuje zabezpieczające hashe identyfikatorów wycofanych tożsamości i blokadę ponownego użycia nazwy konta, a także odniesienia w historii świata, rozliczeniach i kopiach wiadomości innych graczy. Są to dane wymagające odrębnej podstawy i okresu retencji, które operator musi zatwierdzić. Żądania dotyczące pozostałych danych kieruj na year2108@chaos.re.
  - generic [ref=e97]:
    - heading "20. Dane pozostające po zamknięciu konta" [level=2] [ref=e98]
    - paragraph [ref=e99]: Obecny mechanizm zachowuje skrót identyfikatora Google po usunięciu konta, aby uniemożliwić ponowne użycie wycofanej tożsamości. Nie ma dla tego rekordu automatycznego terminu usunięcia; skrót nie oznacza pełnej anonimizacji. Przed finalizacją polityki trzeba ustalić niezbędny okres lub kryterium retencji i zapewnić jego wykonanie. Kopie zapasowe, historia świata oraz treść dowodów w zgłoszeniach mogą wymagać odrębnego usunięcia lub ograniczenia przetwarzania. Nie obiecujemy, że samo odłączenie Google lub kliknięcie usunięcia konta natychmiast usuwa wszystkie takie kopie.
  - generic [ref=e100]:
    - heading "21. Twoje prawa" [level=2] [ref=e101]
    - paragraph [ref=e102]: Na warunkach określonych w RODO możesz żądać dostępu do danych, sprostowania, usunięcia, ograniczenia przetwarzania i przenoszenia danych oraz wnieść sprzeciw. Gdy podstawą jest zgoda, możesz ją wycofać bez wpływu na zgodność wcześniejszego przetwarzania. Możesz złożyć skargę do Prezesa UODO lub właściwego organu nadzorczego. Weryfikacja tożsamości może być potrzebna do bezpiecznej realizacji żądania.
  - generic [ref=e103]:
    - heading "22. Jak złożyć żądanie dotyczące danych" [level=2] [ref=e104]
    - paragraph [ref=e105]: Napisz na year2108@chaos.re, wskazując konto, zakres żądania i sposób kontaktu. Nie musisz przesyłać kopii dokumentu tożsamości. W razie uzasadnionych wątpliwości konieczne może być dodatkowe potwierdzenie kontroli nad kontem, adekwatne do żądania. Zgodnie z RODO informacja o podjętych działaniach powinna zostać udzielona bez zbędnej zwłoki, co do zasady w ciągu miesiąca od otrzymania żądania. Dopuszczalne przedłużenie o maksymalnie dwa kolejne miesiące wymaga powiadomienia w pierwszym miesiącu wraz z uzasadnieniem. Odmowa wymaga podania przyczyn i informacji o możliwości skargi oraz ochrony sądowej.
  - generic [ref=e106]:
    - heading "23. Pozostałe ustalenia przed publikacją" [level=2] [ref=e107]
