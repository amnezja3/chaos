  - paragraph [ref=e8]: Podgląd jest symulacją opartą na zdjęciu archiwalnym, nie transmisją na żywo. Pozycja kamery w grze i pozycja wykonania zdjęcia to osobne dane.
  - paragraph [ref=e9]: "Materiały pilota: fikcyjna ulica Paryża wygenerowana AI dla CHAOS. Nie dokumentuje wskazanej lokalizacji; nie przypisano jej licencji fotograficznej Mapillary."
  - paragraph [ref=e10]: Adapter Mapillary jest przygotowany do kontrolowanego podłączenia. Pozyskiwanie i udostępnianie wymagają osobnych zgód oraz rozstrzygnięcia retencji i linkowania. Ta strona nie oznacza aktywnego publicznego dostępu.
  - paragraph [ref=e11]: Każdy udostępniony materiał dostawcy ma własne autorstwo, źródło, licencję i opis przekształceń w panelu zdjęcia. Ta strona nie zastępuje atrybucji konkretnej fotografii. Nie przyjmujemy zdjęć graczy.
