<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>140.stylization.5 — pierwsza para referencyjna</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c0b;color:#d9e2db;font:14px/1.6 monospace;padding:24px}h1{font:600 24px/1.3 sans-serif;margin:0}p{color:#97a69c;max-width:900px}a{color:#c3d9cb}main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,.65fr);gap:24px;align-items:start}figure{margin:0;min-width:0}figcaption{margin:0 0 10px;color:#a0b3a6}.frame{position:relative;overflow:hidden;background:#030806;outline:1px solid #45594b}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}@media(max-width:850px){main{grid-template-columns:1fr}}
button{background:#0b1711;color:#c3d9cb;border:1px solid #667f6e;padding:10px 16px;font:inherit;cursor:pointer}button:hover{background:#22362b}
</style>
<h1>140.stylization.5 / ARCHIVE / TRANSMISSION</h1>
<p>Desktop / portrait. Zapis archiwum i film. Podgląd bez audio; docelowy miks 0,5 s pozostaje bez zmian.</p>
<p><a href="transmission.html?v=transmission-ref-7" target="_blank" rel="noopener">Otwórz scenę w rozmiarze swojego ekranu</a></p>
<p><button data-view="archive-record">Zapis</button> <button data-view="archive-video">Film</button> <button data-view="archive-transition">Przejście: 5 s → film</button></p>
<main>
<figure><figcaption>DESKTOP / 1920 × 1080</figcaption><div class="frame" data-width="1920" data-height="1080"><iframe src="transmission.html?v=transmission-ref-7" width="1920" height="1080" title="Referencja desktop 1920 na 1080"></iframe></div></figure>
<figure><figcaption>PORTRAIT / 1080 × 1920</figcaption><div class="frame" data-width="1080" data-height="1920"><iframe src="transmission.html?v=transmission-ref-7" width="1080" height="1920" title="Referencja portrait 1080 na 1920"></iframe></div></figure>
</main>
<script>
function fitReferences(){document.querySelectorAll('.frame').forEach(function(frame){var scale=frame.clientWidth/Number(frame.dataset.width);frame.style.height=Number(frame.dataset.height)*scale+'px';frame.firstElementChild.style.transform='scale('+scale+')';});}
window.addEventListener('resize',fitReferences);fitReferences();
document.querySelectorAll('[data-view]').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('iframe').forEach(function(frame){frame.contentWindow.postMessage(button.dataset.view,location.origin);});});});
</script></html>
