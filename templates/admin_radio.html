{% extends "admin_base.html" %}
{% block content %}
<p class="eyebrow">CONTROL / RADIO</p>
<h1>{{ admin_t('radio') }}</h1>
<section class="panel">
  <h2>{{ admin_t('autostart') }}</h2>
  <p>{{ admin_t('autostart_help') }}</p>
  <form id="radio-settings" class="toolbar">
    <label>{{ admin_t('channel') }} <select id="radio-channel" disabled></select></label>
    <button id="radio-save" disabled>{{ admin_t('save') }}</button>
  </form>
  <p id="radio-notice" role="status" aria-live="polite"></p>
  <h2>{{ admin_t('radio_languages') }}</h2>
  <p>{{ admin_t('radio_languages_help') }}</p>
  <ul id="radio-language-validation"></ul>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/admin_radio.js?v=155"></script>{% endblock %}
