<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>CHAOS - Mapa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/images/chaos_favicon.svg" type="image/svg+xml">
  {{ folium_css|safe }}
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/blacknet.css">
  <style>
    .context-menu {
      position: absolute;
      background: #f8f8f8;
      border: 1px solid rgb(102, 102, 102);
      color: #2a2a2a;
      font-family: monospace;
      font-size: 10px;
      z-index: 10000;
      border-radius: 5px;
      padding: 5px;
    }
    .context-menu div {
      padding: 5px 10px;
      cursor: pointer;
    }
    .context-menu div:hover {
      background: rgba(115, 115, 115, 0.5);
    }
    .context-menu div.disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .context-menu div.disabled:hover {
      background: transparent;
    }
    .context-menu div.player-action-disabled {
      opacity: 0.42;
      cursor: default;
    }
    .context-menu div.player-action-disabled:hover {
      background: transparent;
    }
    .context-menu .player-action-reason {
      display: block;
      color: #666;
      font-size: 9px;
      margin-top: 2px;
      max-width: 190px;
      white-space: normal;
    }

    .chaos-map-sync-status {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 11000;
      display: none;
      align-items: center;
      gap: 8px;
      max-width: min(320px, calc(100vw - 28px));
      padding: 8px 11px;
      border: 1px solid rgba(38, 255, 106, 0.7);
      border-radius: 4px;
      background: rgba(3, 10, 6, 0.88);
      color: #9dff9d;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.2;
      box-shadow: 0 0 14px rgba(38, 255, 106, 0.18);
      pointer-events: none;
    }

    .chaos-map-sync-status.is-visible {
      display: flex;
    }

    .chaos-map-sync-status__spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(157, 255, 157, 0.26);
      border-top-color: #26ff6a;
      border-radius: 50%;
      animation: chaos-sync-spin 900ms linear infinite;
      flex: 0 0 auto;
    }

    .chaos-map-boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 15000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(25, 255, 115, 0.10), transparent 34%),
        rgba(0, 0, 0, 0.82);
      color: #d8ffd8;
      font-family: monospace;
      pointer-events: auto;
    }

    .chaos-map-boot-overlay.is-visible {
      display: flex;
    }

    .chaos-map-boot-panel {
      width: min(560px, calc(100vw - 32px));
      border: 1px solid rgba(38, 255, 106, 0.78);
      border-radius: 4px;
      background: rgba(2, 11, 5, 0.94);
      box-shadow: 0 0 32px rgba(38, 255, 106, 0.20);
      padding: 18px;
    }

    .chaos-map-boot-title {
      color: #26ff6a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .chaos-map-boot-progress {
      height: 10px;
      border: 1px solid rgba(38, 255, 106, 0.62);
      background: rgba(0, 0, 0, 0.62);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .chaos-map-boot-progress span {
      display: block;
      width: var(--map-boot-progress, 0%);
      height: 100%;
      background: linear-gradient(90deg, #26ff6a, #b8ff28);
      box-shadow: 0 0 14px rgba(38, 255, 106, 0.72);
      transition: width 180ms ease;
    }

    .chaos-map-boot-step {
      min-height: 18px;
      color: #b8ffb8;
      font-size: 13px;
      line-height: 1.35;
    }

    .chaos-map-boot-note {
      margin-top: 10px;
      color: #7adf90;
      font-size: 11px;
      line-height: 1.35;
    }

    .chaos-map-boot-overlay.is-failed .chaos-map-boot-title {
      color: #ffdd66;
    }

    .chaos-map-scan-overlay {
      position: absolute;
      inset: 0;
      z-index: 720;
      display: none;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(38, 255, 106, 0.06), transparent 22%, transparent 78%, rgba(38, 255, 106, 0.05)),
        repeating-linear-gradient(0deg, rgba(38, 255, 106, 0.055) 0 1px, transparent 1px 18px),
        repeating-linear-gradient(90deg, rgba(38, 255, 106, 0.04) 0 1px, transparent 1px 22px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .chaos-map-scan-overlay.is-visible {
      display: block;
      opacity: 1;
    }

    .chaos-map-scan-overlay::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -18%;
      width: 18%;
      background: linear-gradient(90deg, transparent, rgba(38, 255, 106, 0.18), rgba(184, 255, 40, 0.12), transparent);
      filter: blur(1px);
      animation: chaos-map-scan-sweep 1.25s linear infinite;
    }

    .chaos-map-scan-overlay::after {
      content: attr(data-label);
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 4px 7px;
      border: 1px solid rgba(38, 255, 106, 0.45);
      background: rgba(3, 10, 6, 0.72);
      color: rgba(184, 255, 184, 0.82);
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    @keyframes chaos-map-scan-sweep {
      from { transform: translateX(0); }
      to { transform: translateX(660%); }
    }

    @keyframes chaos-sync-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px), (max-height: 700px) {
      .chaos-map-sync-status {
        right: 8px;
        bottom: 58px;
        max-width: calc(100vw - 16px);
        padding: 6px 9px;
        font-size: 11px;
      }

      .chaos-map-boot-panel {
        padding: 14px;
      }

      .chaos-map-boot-title {
        font-size: 15px;
      }
    }

    .player-actor-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 12000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.62);
      font-family: monospace;
    }

    .player-actor-modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      background: #f8f8f8;
      border: 1px solid #1d5c35;
      border-radius: 6px;
      color: #111;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .player-actor-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid #d6d6d6;
    }

    .player-actor-modal__title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .player-actor-modal__relation {
      margin-top: 4px;
      color: #23633b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .player-actor-modal__close {
      width: 34px;
      height: 34px;
      border: 1px solid #1d5c35;
      border-radius: 4px;
      background: #eef7f0;
      color: #111;
      cursor: pointer;
      font-weight: 700;
      font-size: 18px;
    }

    .player-actor-modal__close:hover {
      background: #dff4e4;
    }

    .player-actor-modal__body {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 18px;
      padding: 18px;
    }

    .player-actor-modal__avatar {
      width: 112px;
      height: 112px;
      border: 1px solid #1d5c35;
      border-radius: 6px;
      background: #111;
      color: #b7ff33;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 700;
      overflow: hidden;
    }

    .player-actor-modal__avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .player-actor-modal__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px;
      font-size: 12px;
    }

    .player-actor-modal__field span {
      display: block;
      color: #35624a;
      font-size: 10px;
      text-transform: uppercase;
    }

    .player-actor-modal__field strong {
      display: block;
      word-break: break-word;
    }

    .player-actor-modal__actions {
      grid-column: 1 / -1;
      border-top: 1px solid #d6d6d6;
      padding-top: 14px;
      margin-top: 2px;
    }

    .player-actor-modal__actions h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .player-actor-modal__action-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .player-actor-modal__action {
      border: 1px solid #b7c8b9;
      border-radius: 4px;
      padding: 8px 10px;
      background: #fff;
      font-size: 11px;
    }

    .player-actor-modal__action.is-enabled {
      border-color: #2cbf71;
      background: #effbf3;
    }

    .player-actor-modal__action.is-disabled {
      opacity: 0.62;
    }

    .player-actor-modal__reason {
      display: block;
      margin-top: 4px;
      color: #666;
      font-size: 10px;
      line-height: 1.3;
    }

    @media (max-width: 640px) {
      .player-actor-modal__body,
      .player-actor-modal__grid,
      .player-actor-modal__action-list {
        grid-template-columns: 1fr;
      }
    }

    .context-menu-clean {
        position: absolute;
        background: #f8f8f8;
        border: 1px solid rgb(102, 102, 102);
        color: #2a2a2a;
        font-family: monospace;
        font-size: 10px;
        z-index: 10000;
        border-radius: 5px;
        padding: 5px;
    }

    .context-menu-clean div {
        padding: 5px 10px;
        cursor: pointer;
    }

    /* Brak podświetlenia */
    .context-menu-clean div:hover {
        background: transparent;
    }

    .security-preset-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 10px 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      font-family: monospace;
    }

    .security-preset-button {
      cursor: pointer;
      border: 1px solid #6f8f77;
      background: #eef4ee;
      color: #17301c;
      font-family: monospace;
      font-size: 9px;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 3px;
      min-width: 42px;
      text-transform: uppercase;
    }

    .security-preset-button:hover {
      border-color: #169a44;
      background: #dff5e4;
      color: #06240e;
    }

    .security-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(98px, 1fr));
      column-gap: 14px;
      row-gap: 5px;
      font-size: 8px;
      line-height: 1.2;
      align-items: center;
      padding: 0 8px 4px;
    }

    .security-row {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 17px;
      white-space: nowrap;
    }

    .security-state {
      display: inline-block;
      width: 14px;
      flex: 0 0 14px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }

    .security-state.on {
      color: #35bf78;
    }

    .security-state.off {
      color: #ff3f6b;
    }

    .leaflet-tooltip {
      pointer-events: none !important;
    }

    .custom-text-icon,
    .territory-contest-target {
      overflow: hidden !important;
    }

    .scan-target-marker-root {
      box-sizing: border-box !important;
      overflow: hidden !important;
      pointer-events: auto !important;
    }

    .scan-target-marker-hitbox {
      box-sizing: border-box;
      overflow: hidden;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #0f0;
      font-family: monospace;
      text-shadow: 1px 1px 2px black;
    }

    .scan-target-marker-hitbox * {
      box-sizing: border-box;
      pointer-events: none;
    }

    .friend-player-marker,
    .area-intruder-marker {
      box-sizing: border-box !important;
      max-width: 68px !important;
      max-height: 76px !important;
      overflow: hidden !important;
      pointer-events: auto !important;
    }

    .player-actor-marker-hitbox {
      box-sizing: border-box;
      overflow: hidden;
      pointer-events: auto;
    }

    .player-actor-marker-hitbox *,
    .player-actor-marker-label,
    .player-actor-marker-avatar,
    .player-actor-marker-badge {
      box-sizing: border-box;
      pointer-events: none;
    }

    .player-actor-marker-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clan-vulnerability-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: monospace;
      color: #d8ff80;
      text-shadow: 0 1px 3px #000;
      transform: translateY(-8px);
    }
    .clan-vulnerability-pin__icon {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      border: 2px solid #b8ff28;
      background: rgba(9, 28, 8, 0.88);
      box-shadow: 0 0 12px rgba(163, 255, 36, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .clan-vulnerability-pin__tag {
      margin-top: 2px;
      padding: 1px 5px;
      border: 1px solid rgba(184, 255, 40, 0.75);
      background: rgba(0, 0, 0, 0.82);
      max-width: 112px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }

    .active-operations-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      width: min(340px, calc(100vw - 24px));
      max-height: min(48vh, 420px);
      overflow: hidden;
      z-index: 9500;
      border: 1px solid rgba(60, 255, 120, 0.76);
      border-radius: 6px;
      background: rgba(5, 12, 8, 0.88);
      color: #e8ffe8;
      font-family: monospace;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
    }

    .active-operations-panel.is-minimized {
      max-height: 38px;
    }

    .active-operations-panel.is-minimized .active-operations-panel__tabs,
    .active-operations-panel.is-minimized .active-operations-panel__body {
      display: none;
    }

    .active-operations-panel.is-expanded {
      top: 12px;
      bottom: 12px;
      max-height: none;
      display: flex;
      flex-direction: column;
    }

    .active-operations-panel.is-empty {
      opacity: 0.72;
    }

    .active-operations-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(60, 255, 120, 0.26);
      color: #9cff9c;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
    }

    .active-operations-panel__title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .active-operations-panel__count {
      color: #c8ffd2;
      font-size: 10px;
      font-weight: 400;
      white-space: nowrap;
    }

    .active-operations-panel__tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 7px 8px 0;
    }

    .active-operations-panel__tab {
      border: 1px solid rgba(60, 255, 120, 0.32);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.26);
      color: #bfffc9;
      font-family: monospace;
      font-size: 10px;
      line-height: 1;
      padding: 6px 8px;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .active-operations-panel__tab.is-active {
      border-color: rgba(60, 255, 120, 0.82);
      background: rgba(30, 130, 60, 0.28);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(60, 255, 120, 0.18);
    }

    .active-operations-panel__body {
      padding: 8px;
      display: grid;
      gap: 7px;
      overflow: auto;
      min-height: 0;
    }

    .active-operations-panel.is-expanded .active-operations-panel__body {
      flex: 1 1 auto;
    }

    .active-operation-card {
      border: 1px solid rgba(94, 255, 139, 0.22);
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.46);
      padding: 7px 8px;
      font-size: 10px;
      line-height: 1.35;
    }

    .active-operation-card__title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .active-operation-card__name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .active-operation-card__icon {
      min-width: 22px;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(125, 255, 157, 0.52);
      border-radius: 4px;
      background: rgba(14, 36, 18, 0.78);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #d6ffd6;
      font-size: 11px;
      box-shadow: 0 0 8px rgba(125, 255, 157, 0.12);
    }

    .active-operation-card__type {
      color: #9cff9c;
    }

    .active-operation-card__status {
      color: #ffd36b;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .active-operation-card__meta {
      color: #bed8c1;
      word-break: break-word;
    }

    .active-operation-card__remaining {
      margin-top: 4px;
      color: #7dff9d;
      font-weight: 700;
    }

    .active-operation-card__risk {
      margin-top: 3px;
      color: #ffd36b;
    }

    .active-operation-card--history {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 6px 7px;
    }

    .active-operation-card--history .active-operation-card__icon {
      width: 20px;
      height: 20px;
      min-width: 20px;
      font-size: 10px;
    }

    .active-operation-history__main {
      min-width: 0;
    }

    .active-operation-history__type {
      color: #e8ffe8;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .active-operation-history__meta {
      color: #8edc9c;
      font-size: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .active-operation-history__size {
      color: #69fff2;
      font-weight: 700;
      white-space: nowrap;
    }

    .active-operation-card--history.status-timeout {
      border-color: rgba(255, 211, 107, 0.34);
    }

    .active-operation-card--history.status-cancelled {
      border-color: rgba(255, 98, 98, 0.42);
      opacity: 0.82;
    }

    .active-operation-card--history.status-completed {
      border-color: rgba(94, 255, 139, 0.32);
    }

    .active-operation-card__actions {
      margin-top: 7px;
      display: flex;
      justify-content: flex-end;
    }

    .active-operation-card__cancel {
      border: 1px solid rgba(255, 98, 98, 0.78);
      border-radius: 4px;
      background: rgba(60, 0, 0, 0.36);
      color: #ffd8d8;
      font-family: monospace;
      font-size: 10px;
      line-height: 1;
      padding: 5px 8px;
      cursor: pointer;
    }

    .active-operation-card__cancel:hover {
      background: rgba(120, 0, 0, 0.58);
      color: #ffffff;
    }

    .active-operation-marker {
      pointer-events: auto;
    }

    .hack-action-spinner-marker {
      pointer-events: none;
      z-index: 940 !important;
    }

    .hack-action-spinner {
      position: absolute;
      width: 9px;
      height: 9px;
      transform: translate(var(--hack-x, 18px), var(--hack-y, -16px));
      filter: drop-shadow(0 0 3px rgba(38, 255, 106, 0.5));
    }

    .hack-action-spinner__ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(38, 255, 106, 0.28);
      border-top-color: #26ff6a;
      border-right-color: rgba(156, 255, 46, 0.75);
      animation: target-operation-spin 0.7s linear infinite;
      background: rgba(0, 16, 7, 0.6);
      box-shadow: 0 0 3px rgba(38, 255, 106, 0.35);
    }

    @media (max-width: 900px), (max-height: 700px) {
      .chaos-map-sync-status__spinner {
        width: 6px;
        height: 6px;
        border-width: 1px;
      }

      .hack-action-spinner {
        width: 5px;
        height: 5px;
        filter: drop-shadow(0 0 1px rgba(38, 255, 106, 0.45));
      }

      .hack-action-spinner__ring {
        border-width: 1px;
        box-shadow: 0 0 1px rgba(38, 255, 106, 0.28);
      }
    }

    @keyframes target-operation-spin {
      to { transform: rotate(360deg); }
    }

    .active-operation-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-10px);
      color: #b7ff33;
      font-family: monospace;
      text-shadow: 0 1px 3px #000;
    }

    .active-operation-pin__badge {
      min-width: 34px;

    @media (max-width: 720px) {

        top: auto;

    body, html {

  <div style="height: 100%; width: 100%;">
    {{ map_html|safe }}
  </div>
  <div id="chaos-map-boot-overlay" class="chaos-map-boot-overlay is-visible" aria-live="polite">
    <div class="chaos-map-boot-panel">
      <div class="chaos-map-boot-title">Ladowanie mapy CHAOS...</div>
      <div class="chaos-map-boot-progress"><span></span></div>
      <div class="chaos-map-boot-step">Inicjalizacja mapy...</div>
      <div class="chaos-map-boot-note">Mapa synchronizuje stan swiata. Akcje beda dostepne po zakonczeniu ladowania.</div>
    </div>
  </div>
  <div id="active-operations-panel" class="active-operations-panel is-empty" aria-live="polite"></div>
  <script id="profile-data" type="application/json">
    {{ profile | tojson }}
  </script>

  <script>
    window.profileData = JSON.parse(
      document.getElementById("profile-data").textContent
    );
  </script>

{{ folium_js|safe }}

    <script>
        const map = window[Object.keys(window).find(k => k.startsWith("map_"))];
        let lastContextWasMarker = false;
        const targetLayerRegistry = new Map();
        let aimedTargetLayer = null;
        let aimedTargetMenuSnapshot = null;
        let scanResultLayers = [];
        const clanVulnerabilityRegistry = new Map();
        window.targetMarkers = window.targetMarkers || {};
        const baseZoom = map.getZoom();
        let zoomReturnTimer = null;
        let zoomReturnInterval = null;
        let programmaticMapMove = false;
        window.activeOperationLayers = [];
        window.incidentHotspotLayers = window.incidentHotspotLayers || {};
        window.latestActiveOperations = [];
        window.latestOperationHistory = [];
        window.operationCenterState = window.operationCenterState || 'preview';
        window.operationCenterTab = window.operationCenterTab || 'active';
        window.mapBootState = window.mapBootState || {
            loading: false,
            ready: false,
            failed: false,
            loadedScopes: new Set()
        };
        window.mapScanEffectState = window.mapScanEffectState || {
            active: 0,
            element: null,
            hideTimer: null,
            startedAt: 0
        };

        function ensureMapScanOverlay() {
            const state = window.mapScanEffectState;
            if (state.element && state.element.isConnected) {
                return state.element;
            }

            const container = map && typeof map.getContainer === 'function'
                ? map.getContainer()
                : document.querySelector('.leaflet-container');
            if (!container) return null;

            const computedPosition = window.getComputedStyle(container).position;
            if (!computedPosition || computedPosition === 'static') {
                container.style.position = 'relative';
            }

            const overlay = document.createElement('div');
            overlay.className = 'chaos-map-scan-overlay';
            overlay.dataset.label = 'Skanowanie mapy';
            overlay.setAttribute('aria-hidden', 'true');
            container.appendChild(overlay);
            state.element = overlay;
            return overlay;
        }

        function beginMapScanEffect(label = 'Skanowanie mapy') {
            const state = window.mapScanEffectState;
            const overlay = ensureMapScanOverlay();
            if (!overlay) return null;

            state.active += 1;
            state.startedAt = performance.now();
            window.clearTimeout(state.hideTimer);
            overlay.dataset.label = label;
            overlay.classList.add('is-visible');

            let finished = false;
            return function finishMapScanEffect() {
                if (finished) return;
                finished = true;
                state.active = Math.max(0, state.active - 1);
                if (state.active > 0) return;

                const elapsed = performance.now() - state.startedAt;
                const delay = Math.max(0, 420 - elapsed);
                state.hideTimer = window.setTimeout(() => {
                    if (state.active === 0 && state.element) {
                        state.element.classList.remove('is-visible');
                    }
                }, delay);
            };
        }

        function finishMapScanEffectAfterPaint(finish) {
            if (typeof finish !== 'function') return;
            window.requestAnimationFrame(() => {
                window.requestAnimationFrame(finish);
            });
        }

        function normalizeBootLoadedScopes() {
            if (!(window.mapBootState.loadedScopes instanceof Set)) {
                window.mapBootState.loadedScopes = new Set(window.mapBootState.loadedScopes || []);
            }
            return window.mapBootState.loadedScopes;
        }

        function mapGameplayBlocked() {
            return !window.mapBootState || window.mapBootState.ready !== true;
        }

        function mapBootOverlay() {
            return document.getElementById('chaos-map-boot-overlay');
        }

        function updateMapBootOverlay(label = 'Synchronizacja mapy...', progress = 0, failed = false) {
            const overlay = mapBootOverlay();
            if (!overlay) return;
            overlay.classList.toggle('is-failed', Boolean(failed));
            const fill = overlay.querySelector('.chaos-map-boot-progress span');
            const step = overlay.querySelector('.chaos-map-boot-step');
            if (fill) {
                fill.style.setProperty('--map-boot-progress', `${Math.max(0, Math.min(100, Math.round(progress)))}%`);
            }
            if (step) {
                step.textContent = label || 'Synchronizacja mapy...';
            }
        }

        function showMapPreloader(label = 'Inicjalizacja mapy...', progress = 0) {
            const overlay = mapBootOverlay();
            if (!overlay) return;
            overlay.classList.add('is-visible');
            updateMapBootOverlay(label, progress);
        }

        function hideMapPreloader() {
            const overlay = mapBootOverlay();
            if (!overlay) return;
            overlay.classList.remove('is-visible', 'is-failed');
        }

        function disableMapGameplay() {
            window.mapBootState.loading = true;
            window.mapBootState.ready = false;
            document.body.dataset.mapGameplayBlocked = '1';
        }

        function enableMapGameplay() {
            window.mapBootState.loading = false;
            window.mapBootState.ready = true;
            delete document.body.dataset.mapGameplayBlocked;
        }

        function notifyMapBootBlocked() {
            updateMapBootOverlay('Mapa synchronizuje stan swiata. Akcje beda dostepne po zakonczeniu ladowania.', 95);
            window.updateMapLoadingStatus?.('Mapa synchronizuje stan swiata...');
        }

        function guardMapGameplayAction() {
            if (!mapGameplayBlocked()) return false;
            closeMenus?.();
            notifyMapBootBlocked();
            return true;
        }

        function waitForMapBootPaint() {
            return new Promise(resolve => {
                requestAnimationFrame(() => requestAnimationFrame(resolve));
            });
        }

        function clearZoomReturn() {
            if (zoomReturnTimer) {
                clearTimeout(zoomReturnTimer);
                zoomReturnTimer = null;
            }
            if (zoomReturnInterval) {
                clearInterval(zoomReturnInterval);
                zoomReturnInterval = null;
            }
        }

        function scheduleZoomReturn() {
            if (programmaticMapMove || map.getZoom() >= baseZoom) return;
            clearZoomReturn();
            zoomReturnTimer = setTimeout(() => {
                zoomReturnInterval = setInterval(() => {
                    const currentZoom = map.getZoom();
                    if (currentZoom >= baseZoom) {
                        clearZoomReturn();
                        return;
                    }
                    programmaticMapMove = true;
                    map.setZoom(Math.min(baseZoom, currentZoom + 1), { animate: true });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 350);
                }, 650);
            }, 1000);
        }

        map.on('zoomend', scheduleZoomReturn);
        map.on('dragstart movestart zoomstart', () => {
            if (!programmaticMapMove) clearZoomReturn();
        });
        map.on('dragend moveend', scheduleZoomReturn);
        map.createPane('territoryPane');
        map.getPane('territoryPane').style.zIndex = 250;
        map.getPane('territoryPane').style.pointerEvents = 'auto';
        map.createPane('incidentPane');
        map.getPane('incidentPane').style.zIndex = 640;
        map.getPane('incidentPane').style.pointerEvents = 'auto';

        function targetLayerKey(lat, lng, label = "") {
            return `${Number(lat).toFixed(6)}:${Number(lng).toFixed(6)}:${label || ""}`;
        }

        function vulnerabilityTargetKey(target) {
            if (!target) return "";
            const lat = Number(target.lat);
            const lng = Number(target.lng !== undefined ? target.lng : target.lon);
            const label = String(target.label || target.name || "");
            if (Number.isNaN(lat) || Number.isNaN(lng)) return "";
            return `${lat.toFixed(5)}:${lng.toFixed(5)}:${label}`;
        }

        function refreshParentToolbarProfile() {
            try {
                if (window.parent && window.parent !== window && typeof window.parent.refreshToolbarProfile === 'function') {
                    return window.parent.refreshToolbarProfile();
                }
            } catch (err) {
                // Parent toolbar refresh is optional.
            }
            return Promise.resolve(null);
        }

        function findClanVulnerabilityForTarget(target) {
            const key = vulnerabilityTargetKey(target);
            return key ? clanVulnerabilityRegistry.get(key) : null;
        }

        function rememberTargetLayer(lat, lng, label, layer) {
            const key = targetLayerKey(lat, lng, label);
            const previous = targetLayerRegistry.get(key);
            if (previous) {
                removeMapLayerSafe(previous);
            }
            targetLayerRegistry.set(key, layer);
            return layer;
        }

        function consumeMapContextEvent(e) {
            const original = e && (e.originalEvent || e);
            if (!original) return;
            if (original.preventDefault) original.preventDefault();
            if (original.stopPropagation) original.stopPropagation();
            if (original.stopImmediatePropagation) original.stopImmediatePropagation();
            if (window.L && L.DomEvent && L.DomEvent.stop) {
                L.DomEvent.stop(original);
            }
            lastContextWasMarker = true;
        }

        function cloneMapMenuPayload(value) {
            if (!value || typeof value !== 'object') return value;
            try {
                if (typeof structuredClone === 'function') {
                    return structuredClone(value);
                }
            } catch (err) {
                // Fall through to JSON clone for plain map payloads.
            }
            try {
                return JSON.parse(JSON.stringify(value));
            } catch (err) {
                return { ...value };
            }
        }

        function freezeMapMenuPayload(value) {
            const snapshot = cloneMapMenuPayload(value);
            if (snapshot && typeof snapshot === 'object') {
                try {
                    return Object.freeze(snapshot);
                } catch (err) {
                    return snapshot;
                }
            }
            return snapshot;
        }

        function normalizeMapMenuTarget(target) {
            const snapshot = cloneMapMenuPayload(target || {});
            if (!snapshot || typeof snapshot !== 'object') return {};
            const lat = Number(snapshot.lat);
            const lng = Number(snapshot.lng !== undefined ? snapshot.lng : snapshot.lon);
            if (Number.isFinite(lat)) snapshot.lat = lat;
            if (Number.isFinite(lng)) {
                snapshot.lng = lng;
                snapshot.lon = lng;
            }
            snapshot.label = mapTargetDisplayLabel(snapshot, snapshot.target_mode === 'player' ? 'SUBJECT' : null);
            snapshot.name = isMissingTargetDisplayName(snapshot.name) ? snapshot.label : snapshot.name;
            snapshot.target_id = targetStableId(snapshot);
            return freezeMapMenuPayload(snapshot);
        }

        function removeMapLayerSafe(layer) {
            if (!layer) return;
            if (typeof layer.closePopup === 'function') layer.closePopup();
            if (typeof layer.unbindPopup === 'function') layer.unbindPopup();
            if (typeof layer.closeTooltip === 'function') layer.closeTooltip();
            if (typeof layer.unbindTooltip === 'function') layer.unbindTooltip();
            if (typeof layer.off === 'function') layer.off();
            if (map.hasLayer(layer)) map.removeLayer(layer);
        }

        function registerLayerInArray(name, layer) {
            window[name] = window[name] || [];
            if (layer) {
                layer._chaosLayerRegistry = name;
                window[name].push(layer);
            }
            return layer;
        }

        function clearLayerArray(name) {
            window[name] = window[name] || [];
            const knownLayers = new Set(window[name]);

            map.eachLayer(layer => {
                if (layer && layer._chaosLayerRegistry === name) {
                    knownLayers.add(layer);
                }
            });

            knownLayers.forEach(layer => {
                try {
                    removeMapLayerSafe(layer);
                    if (layer) {
                        delete layer._chaosLayerRegistry;
                    }
                } catch (err) {
                    console.warn('[map] Nie udalo sie usunac layera', name, err);
                }
            });

            window[name] = [];
        }

        function territoryStableId(area = {}) {
            const explicitId = area.territory_id || area.id || area.area_id;
            if (explicitId !== undefined && explicitId !== null && String(explicitId).trim()) {
                return String(explicitId).trim();
            }
            const owner = String(area.owner_username || area.owner_id || 'unknown').trim() || 'unknown';
            const lat = Number(area.centroid_lat || (area.centroid || {}).lat || 0).toFixed(6);
            const lng = Number(area.centroid_lng || (area.centroid || {}).lng || 0).toFixed(6);
            return `${owner}:${lat}:${lng}`;
        }

        function territoryLayerStyle(area = {}) {
            const isMine = area.is_mine === true;
            const isEncircled = area.status === 'encircled';
            return {
                pane: 'territoryPane',
                color: isEncircled ? '#ffcc33' : (isMine ? '#26ff6a' : '#ff4b4b'),
                fillColor: isEncircled ? '#b88700' : (isMine ? '#0aa83d' : '#b62020'),
                fillOpacity: isEncircled ? 0.26 : (isMine ? 0.13 : 0.20),
                weight: isEncircled ? 4 : (isMine ? 2 : 3),
                dashArray: isEncircled ? '4 5' : (isMine ? null : '8 6'),
                interactive: true
            };
        }

        function territoryTooltip(area = {}) {
            const ownerNick = window.escapeMapText(area.owner_nick || area.owner_username || area.owner_id || 'unknown');
            const ownerUsername = window.escapeMapText(area.owner_username || area.owner_id || 'unknown');
            const ownerClan = window.escapeMapText(area.owner_clan || 'brak');
            const status = window.escapeMapText(area.status || 'active');
            const size = Math.round(Number(area.area_size || 0));
            return `${area.is_mine ? 'Twoje pole' : 'Pole gracza'}: ${ownerNick}<br>Login: ${ownerUsername}<br>Klan: ${ownerClan}<br>Status: ${status}<br>Pow.: ${size} mÂ˛`;
        }

        function renderTerritoryAreaLayer(area = {}) {
            const territoryId = territoryStableId(area);
            const points = (area.vertices || [])
                .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
            if (points.length < 3) return null;
            if (!isSaneTerritoryPolygon(points)) {
                console.warn('[map] Pominieto podejrzane terytorium', area.owner_username, points);
                return null;
            }

            const polygon = registerLayerInArray('playerAreaLayers', L.polygon(points, territoryLayerStyle(area)));
            polygon._chaosTerritoryId = territoryId;
            polygon._chaosTerritorySnapshot = { ...area, territory_id: territoryId };
            polygon.addTo(map);
            polygon.bindTooltip(territoryTooltip(area), {
                sticky: true,
                opacity: 0.95
            });
            window.territoryAreaLayers[territoryId] = {
                id: territoryId,
                layer: polygon,
                area: polygon._chaosTerritorySnapshot
            };
            return polygon;
        }

        function renderTerritoryConflictLayer(conflict = {}) {
            const intersections = conflict.intersections && conflict.intersections.length
                ? conflict.intersections
                : [conflict.intersection || []];
            const participants = conflict.participants_display
                ? window.escapeMapText(conflict.participants_display)
                : (conflict.participant_names || conflict.participants || [])
                    .map(name => window.escapeMapText(name))
                    .join(', ');

            intersections.forEach((intersection, index) => {
                const points = (intersection || [])
                    .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                    .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
                if (points.length < 3) return;
                if (!isSaneTerritoryPolygon(points)) {
                    console.warn('[map] Pominieto podejrzany konflikt terytorium', conflict.id, points);
                    return;
                }

                const polygon = registerLayerInArray('conflictAreaLayers', L.polygon(points, {
                    pane: 'territoryPane',
                    color: '#ffb300',
                    fillColor: '#ff8a00',
                    fillOpacity: 0.18,
                    weight: 3,
                    dashArray: '3 5',
                    interactive: true
                }));
                polygon._chaosTerritoryConflictId = `${conflict.id || conflict.conflict_key || 'conflict'}:${index}`;
                polygon.addTo(map);
                polygon.bindTooltip(`Konflikt terytorium<br>Uczestnicy: ${participants || 'brak'}<br>Strefa: ${index + 1}`, {
                    sticky: true,
                    opacity: 0.95
                });
                window.territoryConflictLayers[polygon._chaosTerritoryConflictId] = {
                    id: polygon._chaosTerritoryConflictId,
                    layer: polygon,
                    conflict
                };
            });
        }

        function resetTerritoryLayerRegistries() {
            window.territoryAreaLayers = {};
            window.territoryConflictLayers = {};
        }

        function getLayerTooltipText(layer) {
            if (!layer || typeof layer.getTooltip !== 'function') return '';
            const tooltip = layer.getTooltip();
            if (!tooltip) return '';
            const content = typeof tooltip.getContent === 'function'
                ? tooltip.getContent()
                : tooltip._content;
            return String(content || '');
        }

        function isLegacyPlayerAreaTooltipText(text) {
            const value = String(text || '');
            return [
                'Pole gracza',
                'Twoje pole',
                'Konflikt terytorium'
            ].some(pattern => value.includes(pattern));
        }

        function cleanupLegacyPlayerAreaTooltipDom() {
            document.querySelectorAll('.leaflet-tooltip').forEach(node => {
                const text = `${node.textContent || ''} ${node.innerHTML || ''}`;
                if (isLegacyPlayerAreaTooltipText(text)) {
                    node.remove();
                }
            });
        }

        function cleanupLegacyPlayerAreaLayers() {
            cleanupLegacyPlayerAreaTooltipDom();

            map.eachLayer(layer => {
                if (!layer || layer._chaosLayerRegistry) return;
                const looksLikePolygon = (window.L && L.Polygon && layer instanceof L.Polygon)
                    || (typeof layer.getBounds === 'function' && typeof layer.getLatLngs === 'function');
                if (!looksLikePolygon) return;

                const tooltipText = getLayerTooltipText(layer);
                if (!isLegacyPlayerAreaTooltipText(tooltipText)) return;

                try {
                    removeMapLayerSafe(layer);
                } catch (err) {
                    console.warn('[map] Nie udalo sie usunac legacy player area layer', err);
                }
            });

            cleanupLegacyPlayerAreaTooltipDom();
        }
        window.cleanupLegacyPlayerAreaLayers = cleanupLegacyPlayerAreaLayers;

        function scheduleLegacyPlayerAreaCleanup() {
            [0, 250, 1000, 2000, 5000].forEach(delay => {
                setTimeout(cleanupLegacyPlayerAreaLayers, delay);
            });
        }

        if (!map._chaosLegacyPlayerAreaCleanupBound) {
            map._chaosLegacyPlayerAreaCleanupBound = true;
            map.on('layeradd', event => {
                const layer = event && event.layer;
                setTimeout(() => {
                    if (!layer || layer._chaosLayerRegistry) return;
                    const looksLikePolygon = (window.L && L.Polygon && layer instanceof L.Polygon)
                        || (typeof layer.getBounds === 'function' && typeof layer.getLatLngs === 'function');
                    if (!looksLikePolygon) return;
                    if (!isLegacyPlayerAreaTooltipText(getLayerTooltipText(layer))) return;
                    removeMapLayerSafe(layer);
                    cleanupLegacyPlayerAreaTooltipDom();
                }, 0);
            });
        }

        function isSaneTerritoryPolygon(points) {
            if (!Array.isArray(points) || points.length < 3) return false;

            const lats = points.map(point => Number(point[0])).filter(Number.isFinite);
            const lngs = points.map(point => Number(point[1])).filter(Number.isFinite);
            if (lats.length !== points.length || lngs.length !== points.length) return false;

            const latSpan = Math.max(...lats) - Math.min(...lats);
            const lngSpan = Math.max(...lngs) - Math.min(...lngs);
            return latSpan <= 0.25 && lngSpan <= 0.25;
        }

        function clearScanResultLayers() {
            scanResultLayers.forEach(layer => {
                removeMapLayerSafe(layer);
            });
            scanResultLayers = [];
        }

        function rememberScanResultLayer(layer) {
            scanResultLayers.push(layer);
            return layer;
        }

        function removeScanResultForTarget(target) {
            const targetKey = vulnerabilityTargetKey(target);
            if (!targetKey) return;
            scanResultLayers = scanResultLayers.filter(layer => {
                const layerTarget = layer && layer._scanTarget;
                if (vulnerabilityTargetKey(layerTarget) !== targetKey) {
                    return true;
                }
                removeMapLayerSafe(layer);
                return false;
            });
        }

        function removeScanResultAt(lat, lng) {
            const wantedLat = Number(lat).toFixed(6);
            const wantedLng = Number(lng).toFixed(6);
            scanResultLayers = scanResultLayers.filter(layer => {
                if (!layer.getLatLng) return true;
                const pos = layer.getLatLng();
                const matches = Number(pos.lat).toFixed(6) === wantedLat && Number(pos.lng).toFixed(6) === wantedLng;
                if (matches) removeMapLayerSafe(layer);
                return !matches;
            });
        }

        function removeContestedTargetAt(lat, lng) {
            const wantedLat = Number(lat).toFixed(6);
            const wantedLng = Number(lng).toFixed(6);
            if (!Array.isArray(window.contestedTargetLayers)) return;
            window.contestedTargetLayers = window.contestedTargetLayers.filter(layer => {
                if (!layer.getLatLng) return true;
                const pos = layer.getLatLng();
                const matches = Number(pos.lat).toFixed(6) === wantedLat && Number(pos.lng).toFixed(6) === wantedLng;
                if (matches) removeMapLayerSafe(layer);
                return !matches;
            });
        }

        function hideDomTargetMarkers(lat, lng, label = "") {
            const wantedLat = Number(lat).toFixed(6);
            const wantedLng = Number(lng).toFixed(6);
            document.querySelectorAll('.marker-label, .marker-hacked').forEach(el => {
                const elLat = Number(el.dataset.lat).toFixed(6);
                const elLng = Number(el.dataset.lng).toFixed(6);
                const labelMatches = !label || !el.dataset.label || el.dataset.label === label;
                if (elLat === wantedLat && elLng === wantedLng && labelMatches) {
                    unregisterTargetMarker(el.dataset.targetId || (el._chaosTargetSnapshot || {}));
                    const markerEl = el.closest('.leaflet-marker-icon');
                    if (markerEl) markerEl.style.display = 'none';
                }
            });
        }

        function isMissingTargetDisplayName(value) {
            const normalized = String(value || '').trim().toLowerCase();
            return !normalized || ['brak nazwy', 'brak_nazwy', 'no name', 'unnamed', 'unnamed target', 'unknown', 'none', 'null', 'nieznany obiekt'].includes(normalized);
        }

        function targetDisplayCode(obj = {}) {
            const seed = [
                obj.osm_id,
                obj.node_id,
                obj.id,
                obj.lat,
                obj.lng ?? obj.lon,
                obj.source_type,
                obj.target_type,
                obj.procedural_seed
            ].filter(value => value !== undefined && value !== null && String(value).trim() !== '').join('|') || JSON.stringify(obj);
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16).toUpperCase().padStart(6, '0').slice(0, 6);
        }

        function targetDisplayPrefix(obj = {}) {
            const sourceType = String(obj.source_type || '').toLowerCase();
            const targetType = String(obj.target_type || '').toLowerCase();
            if (targetType === 'vehicle' || sourceType === 'car' || sourceType === 'vehicle') return 'ECU';
            if (targetType === 'person' || targetType === 'player' || sourceType === 'person' || sourceType === 'player') return 'SUBJECT';
            if (targetType === 'phone' || sourceType === 'phone') return 'DEVICE';
            if (targetType === 'camera' || sourceType === 'camera') return 'CAM';
            if (targetType === 'atm' || sourceType === 'atm') return 'ATM';
            if (['router', 'server'].includes(targetType) || ['router', 'server', 'hotspot'].includes(sourceType)) return 'NET';
            if (['shop', 'amenity', 'restaurant', 'bar', 'cafe', 'fast_food', 'parking', 'office'].includes(sourceType)) return 'NODE';
            if (targetType === 'poi') return 'POI';
            return 'TARGET';
        }

        function mapTargetDisplayLabel(obj = {}, fallbackPrefix = null) {
            for (const key of ['display_label', 'label', 'name', 'title']) {
                if (!isMissingTargetDisplayName(obj[key])) return String(obj[key]).trim();
            }
            return `${fallbackPrefix || targetDisplayPrefix(obj)}-${targetDisplayCode(obj)}`;
        }

        function targetStableId(obj = {}) {
            if (obj.target_id) return String(obj.target_id);
            if (obj.target_mode === 'player' && obj.target_username) return `player:${obj.target_username}`;
            if (obj.vulnerability_id) return `vulnerability:${obj.vulnerability_id}`;
            const coordKey = value => {
                const number = Number(value);
                return Number.isFinite(number)
                    ? String(Math.round(number * 100000) / 100000)
                    : 'unknown';
            };
            if (obj.foreign_area_id) {
                return `territory_contest:${obj.foreign_area_id}:${coordKey(obj.lat)}:${coordKey(obj.lng !== undefined ? obj.lng : obj.lon)}`;
            }
            const label = mapTargetDisplayLabel(obj, 'TARGET');
            return `map:${coordKey(obj.lat)}:${coordKey(obj.lng !== undefined ? obj.lng : obj.lon)}:${label}`;
        }

        function registerTargetMarker(target, marker, options = {}) {
            const normalized = normalizeMapMenuTarget(target || {});
            const targetId = normalized.target_id || targetStableId(normalized);
            if (!targetId) return normalized;
            window.targetMarkers[targetId] = {
                target_id: targetId,
                target: normalized,
                marker: marker || null,
                element: options.element || null,
                source: options.source || 'target',
                layer_type: options.layer_type || 'target_marker'
            };
            if (marker) {
                marker._chaosTargetId = targetId;
                marker._chaosTargetSnapshot = normalized;
            }
            if (options.element) {
                options.element.dataset.targetId = targetId;
                options.element._chaosTargetSnapshot = normalized;
            }
            return normalized;
        }

        function unregisterTargetMarker(targetOrId) {
            const targetId = typeof targetOrId === 'string'
                ? targetOrId
                : targetStableId(targetOrId || {});
            if (targetId && window.targetMarkers[targetId]) {
                delete window.targetMarkers[targetId];
            }
        }

        function targetDeltaIcon(target, captured = false) {
            const icon = target.icon || (captured ? '📦' : '🎯');
            const className = captured ? 'target-hacked' : 'custom-text-icon scan-target-marker-root';
            const html = captured
                ? `<div style="font-size:3rem;line-height:2rem;">${window.escapeMapText(icon)}</div>`
                : `<div class="scan-target-marker-hitbox" style="width:80px;height:40px;max-width:80px;max-height:40px;font-size:2.5rem;line-height:40px;"><div>${window.escapeMapText(icon)}</div></div>`;
            return L.divIcon({
                className,

                iconSize: captured ? [32, 42] : [80, 40],
                iconAnchor: captured ? [16, 42] : [40, 20]
            });
        }

        window.applyMapTargetDelta = function(event) {
            const payload = (event && event.payload) || event || {};
            const type = (event && event.type) || payload.type || "";
            const target = normalizeMapMenuTarget(payload.target || payload);
            const targetId = payload.target_id || (event && event.entity_id) || target.target_id;
            if (!targetId) return false;

            const entry = window.targetMarkers[targetId];
            if (!entry) return false;

            if (type === "map.target_removed" || payload.removed) {
                if (entry.marker) {
                    removeMapLayerSafe(entry.marker);
                }
                if (entry.element) {
                    const markerEl = entry.element.closest('.leaflet-marker-icon');
                    if (markerEl) markerEl.style.display = 'none';
                    entry.element.style.display = 'none';
                }
                unregisterTargetMarker(targetId);
                return true;
            }

            const lat = Number(target.lat);
            const lng = Number(target.lng !== undefined ? target.lng : target.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;

            const captured = type === "map.target_captured" || payload.captured || target.captured;
            const label = mapTargetDisplayLabel(target, "TARGET");

            if (entry.marker && typeof entry.marker.setLatLng === 'function') {
                entry.marker.setLatLng([lat, lng]);
                entry.marker.setIcon(targetDeltaIcon(target, captured));
                if (typeof entry.marker.bindTooltip === 'function') {
                    entry.marker.bindTooltip(label, { permanent: false, direction: 'top' });
                }
                entry.marker._chaosTargetSnapshot = target;
            }
            if (entry.element) {
                entry.element.dataset.label = label;
                entry.element.dataset.lat = String(lat);
                entry.element.dataset.lng = String(lng);
                entry.element.dataset.targetId = targetId;
                entry.element._chaosTargetSnapshot = target;
            }
            window.targetMarkers[targetId] = {
                ...entry,
                target,
                target_id: targetId,
                source: captured ? 'targetDeltaCaptured' : (entry.source || 'targetDeltaUpdated')
            };
            return true;
        };

        function readBlacknetFocusCoordinate(value) {
            if (value === null || value === undefined || value === '') return NaN;
            const number = Number(value);
            return Number.isFinite(number) ? number : NaN;
        }

        window.focusBlacknetMapSignal = function(focus = {}) {
            const ids = [
                focus.target_id,
                focus.entity_id,
                focus.region_id
            ].map(value => String(value || '').trim()).filter(Boolean);
            let entry = null;
            for (const id of ids) {
                if (window.targetMarkers && window.targetMarkers[id]) {
                    entry = window.targetMarkers[id];
                    break;
                }
            }

            let lat = readBlacknetFocusCoordinate(focus.lat);
            let lng = readBlacknetFocusCoordinate(focus.lng);
            if ((!Number.isFinite(lat) || !Number.isFinite(lng)) && entry) {
                const target = entry.target || {};
                lat = Number(target.lat);
                lng = Number(target.lng !== undefined ? target.lng : target.lon);
                if ((!Number.isFinite(lat) || !Number.isFinite(lng)) && entry.marker && typeof entry.marker.getLatLng === 'function') {
                    const markerLatLng = entry.marker.getLatLng();
                    lat = Number(markerLatLng.lat);
                    lng = Number(markerLatLng.lng);
                }
            }
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                return false;
            }

            const currentZoom = typeof map.getZoom === 'function' ? map.getZoom() : 16;
            const nextZoom = Math.max(currentZoom, focus.mode === 'teleport' ? 17 : 16);
            if (focus.mode === 'teleport') {
                const position = { lat, lng };
                if (window.profileData && typeof window.profileData === 'object') {
                    window.profileData.curently_possition = position;
                    window.profileData.current_position = position;
                }
                if (window.avatarMarkerRef && typeof window.avatarMarkerRef.setLatLng === 'function') {
                    const previous = window.avatarMarkerRef.getLatLng && window.avatarMarkerRef.getLatLng();
                    if (previous && typeof getBikeDirection === 'function' && typeof buildBikeIcon === 'function') {
                        window.avatarMarkerRef.setIcon(buildBikeIcon(getBikeDirection(
                            { lat: previous.lat, lng: previous.lng },
                            position
                        )));
                    }
                    window.avatarMarkerRef.setLatLng([lat, lng]);
                }
            }
            map.setView([lat, lng], nextZoom, { animate: true });
            if (entry && entry.marker && typeof entry.marker.openTooltip === 'function') {
                setTimeout(() => entry.marker.openTooltip(), 250);
            }
            return true;
        };

        window.addEventListener('message', event => {
            if (event.origin !== window.location.origin) return;

            if (payload && payload.type === 'blacknet-map-focus') {
                window.focusBlacknetMapSignal(payload.focus || {});
            }

        window.refreshMapTargetSnapshot = function() {

        function isContextEventInsideMarkerHitbox(marker, e, targetSnapshot = {}, source = 'marker') {
            const element = marker && typeof marker.getElement === 'function'
                ? marker.getElement()
                : null;
            const rect = element && typeof element.getBoundingClientRect === 'function'
                ? element.getBoundingClientRect()
                : null;
            const originalEvent = e && e.originalEvent;

            if (!rect || !originalEvent
                || originalEvent.clientX < rect.left
                || originalEvent.clientX > rect.right
                || originalEvent.clientY < rect.top
                || originalEvent.clientY > rect.bottom) {
                return false;
            }

            return true;
        }

        function showMapMenuFromOriginalContextEvent(e) {
            const originalEvent = e && e.originalEvent;
            if (!originalEvent || !map || typeof map.mouseEventToContainerPoint !== 'function') return;
            const containerPoint = map.mouseEventToContainerPoint(originalEvent);
            const latlng = map.containerPointToLatLng(containerPoint);

            closeAllMapMenus();
            showContextMenu(
                containerPoint.x,
                containerPoint.y,
                latlng.lat,
                latlng.lng,
                true
            );
        }

        function addInteractiveTargetMarker(lat, lng, label = "Cel", icon = "🎯", obj = {}) {
            const displayObj = { ...obj, lat, lng, label };

            removeScanResultAt(lat, lng);
            hideDomTargetMarkers(lat, lng, label);
            const markerObj = normalizeMapMenuTarget({
                ...obj,
                lat: Number(lat),
                lon: Number(lng),
                lng: Number(lng),
                label,

            const marker = L.marker([markerObj.lat, markerObj.lon], {

                    iconSize: [80, 40],

                })
            }).addTo(map);
            marker.bindTooltip(label, { permanent: false, direction: 'top' });
            marker.on('contextmenu', function(e) {

            aimedTargetMenuSnapshot = {

        function renderCurrentAimedTargetMarker() {

        function formatTeleportTerminalCommand(lat, lng) {
            const latNum = Number(lat);
            const lngNum = Number(lng);
            if (!Number.isFinite(latNum) || !Number.isFinite(lngNum)) {
                return "";
            }
            return `teleport ${latNum.toFixed(6)}:${lngNum.toFixed(6)}`;
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                return navigator.clipboard.writeText(text);
            }
            return new Promise((resolve, reject) => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', 'readonly');
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    const copied = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copied ? resolve() : reject(new Error('copy_failed'));
                } catch (err) {
                    document.body.removeChild(textarea);
                    reject(err);
                }
            });
        }

        function copyTeleportCommandFromMap(lat, lng) {

            if (!command) {
                addSystemMessage("warning", "Mapa", "Nieprawidlowe wspolrzedne teleportu.");
                return;
            }
            copyTextToClipboard(command)
                .then(() => {
                    addSystemMessage("info", "Mapa", `Skopiowano komende terminala: ${command}`);

                .catch(() => {
                    addSystemMessage("warning", "Mapa", `Nie udalo sie skopiowac. Komenda: ${command}`);

        function showHackingMenuForMarker(x, y, obj, iconEmoji, label, source = 'marker') {

            const menuTarget = normalizeMapMenuTarget(obj || {});

        function hackingAction(action, lat, lng, label, icon, source_type = "manual", name = label, generated = false, vulnerability_id = null, target_mode = null, contest_owner_username = null, foreign_area_id = null, target_username = null) {
            if (guardMapGameplayAction()) return;
            closeMenus();
            const hackFlowId = `hf-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
            if (typeof window.startHackActionSpinner === 'function') {
                window.startHackActionSpinner(hackFlowId, { action, lat, lng, label });
            }
            if (typeof window.pauseMapOptionalRefresh === 'function') {
                window.pauseMapOptionalRefresh('hack_action');
            }

            fetch('/hack-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action,
                    lat,
                    lng,
                    label,
                    icon,
                    source_type,
                    name,
                    generated,
                    vulnerability_id,
                    target_mode,
                    contest_owner_username,
                    foreign_area_id,
                    target_username,
                    _flow_id: hackFlowId
                })
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok || data.blocked) {
                    addSystemMessage("warning", `⛔ ${action}`, data.status || "Akcja zablokowana.");
                    return null;
                }
                return data;
            })
            .then(async data => {
                if (!data) return;
                if (data.tool_selection_required) {
                    if (typeof window.stopHackActionSpinner === 'function') {
                        window.stopHackActionSpinner(hackFlowId);
                    }
                    const opener = window.parent && window.parent !== window
                        ? window.parent.openToolSelectionForMapAction
                        : window.openToolSelectionForMapAction;
                    if (typeof opener === 'function') {
                        opener(data);
                    } else {
                        addSystemMessage("warning", "🛠️ Narzędzia", "Otwórz Pliki i wybierz narzędzie z /tools.");
                    }
                    addSystemMessage("info", `🛠️ ${action}`, data.status || "Wybierz narzędzie.");
                    return;
                }
                if (data.target && data.target.lat !== undefined && (data.target.lng !== undefined || data.target.lon !== undefined)) {
                    const target = data.target;
                    const targetLat = Number(target.lat);
                    const targetLng = Number(target.lng !== undefined ? target.lng : target.lon);
                    if (Number.isFinite(targetLat) && Number.isFinite(targetLng)) {
                        window.profileData = window.profileData || {};
                        window.profileData.aimed_target = target;
                        addInteractiveTargetMarker(
                            targetLat,
                            targetLng,
                            mapTargetDisplayLabel(target, "TARGET"),
                            target.icon || icon || "🎯",
                            target
                        );
                    }
                }
                await refreshParentToolbarProfile();
                if (window.refreshActiveOperations) {
                    await window.refreshActiveOperations();
                }
                addSystemMessage("success", `✅ ${action}`, data.status);
            })
            .catch(err => {
                addSystemMessage("danger", "❌ Hackowanie", "Błąd operacji hackowania");
            })
            .finally(() => {
                if (typeof window.stopHackActionSpinner === 'function') {
                    window.stopHackActionSpinner(hackFlowId);
                }
                if (typeof window.resumeMapOptionalRefresh === 'function') {
                    window.resumeMapOptionalRefresh(1200);
                }
            });
        }

        async function reportVulnerability(target) {
            closeMenus();
            try {
                const res = await fetch('/api/vulnerabilities/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                const message = data.message || (data.success ? 'Podatnosc wystawiona.' : 'Nie udalo sie wystawic podatnosci.');

                if (!res.ok || !data.success) {
                    addSystemMessage('warning', 'Podatnosc', message);
                    return;
                }

                addSystemMessage('success', 'Podatnosc', message);
                removeScanResultForTarget(target);
                if (data.report) {
                    const reportTarget = data.report.target || target;
                    const registryTarget = {
                        ...reportTarget,
                        vulnerability_id: data.report.id,
                        lat: Number(data.report.lat || reportTarget.lat || target.lat),
                        lng: Number(data.report.lng || reportTarget.lng || reportTarget.lon || target.lng || target.lon),
                        lon: Number(data.report.lng || reportTarget.lng || reportTarget.lon || target.lng || target.lon),
                        label: data.report.label || reportTarget.label || target.label,
                        name: data.report.name || reportTarget.name || target.name,
                        icon: data.report.icon || reportTarget.icon || target.icon,
                        source_type: data.report.source_type || reportTarget.source_type || target.source_type,
                        generated: Boolean(data.report.generated || reportTarget.generated || target.generated),
                        security: data.report.security || reportTarget.security || {}
                    };
                    const registryKey = vulnerabilityTargetKey(registryTarget);
                    if (registryKey) {
                        clanVulnerabilityRegistry.set(registryKey, {
                            ...data.report,
                            is_reporter: Boolean(data.report.is_reporter),
                            target: registryTarget
                        });
                    }
                }
                if (window.refreshClanVulnerabilities) {
                    window.refreshClanVulnerabilities();
                }
            } catch (err) {
                console.warn('Vulnerability report failed', err);
                addSystemMessage('warning', 'Podatnosc', 'Nie udalo sie wystawic podatnosci.');
            } finally {
                lastContextWasMarker = false;
            }
        }

                        lng: parseFloat(toRaw.lng)
                    };

                        isNaN(from.lat) || isNaN(from.lng) ||
                        isNaN(to.lat) || isNaN(to.lng)

                        addSystemMessage("danger", "📍 Błąd", "Nieprawidłowe współrzędne.");
                        return;
                    }

                    if (data.status === "too_far") {
                        addSystemMessage("warning", "🧭 Podróż", "Cel jest zbyt oddalony.");
                        // Bez przeładowania mapy przy błędzie zasięgu.
                        return;

                    const avatarMarker = window.avatarMarkerRef;

                        console.warn("⚠️ Nie znaleziono markera awatara");

                    window.profileData.curently_possition = { ...to };
                    if (window.refreshPlayerActors) {

                    }
                }



                return data;

        function getBikeDirection(from, to) {
            const dx = to.lng - from.lng;
            const dy = to.lat - from.lat;
            if (Math.abs(dx) < 0.000001 && Math.abs(dy) < 0.000001) return "right";

            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angle >= -22.5 && angle < 22.5) return "right";
            if (angle >= 22.5 && angle < 67.5) return "up_right";
            if (angle >= 67.5 && angle < 112.5) return "up";
            if (angle >= 112.5 && angle < 157.5) return "up_left";
            if (angle >= 157.5 || angle < -157.5) return "left";
            if (angle >= -157.5 && angle < -112.5) return "down_left";
            if (angle >= -112.5 && angle < -67.5) return "down";
            return "down_right";
        }

        function updateAvatarDirection(targetLatLng) {
            const marker = window.avatarMarkerRef;
            if (!marker || !targetLatLng) return;
            const current = marker.getLatLng();
            const direction = getBikeDirection(
                { lat: current.lat, lng: current.lng },
                { lat: targetLatLng.lat, lng: targetLatLng.lng }
            );
            if (window.avatarBikeDirection === direction) return;
            window.avatarBikeDirection = direction;
            marker.setIcon(buildBikeIcon(direction));
        }

        async function animateAvatarTravel(marker, from, to, duration = 2000) {
            window.avatarBikeDirection = null;
            marker.setIcon(buildBikeIcon(getBikeDirection(from, to)));
            return new Promise(resolve => {
                const steps = 60;
                const interval = duration / steps;
                let step = 0;

                const deltaLat = (to.lat - from.lat) / steps;
                const deltaLng = (to.lng - from.lng) / steps;

                const move = () => {
                    step++;
                    const newLat = from.lat + deltaLat * step;
                    const newLng = from.lng + deltaLng * step;
                    marker.setLatLng([newLat, newLng]);
                    marker.setIcon(buildBikeIcon(getBikeDirection(
                        { lat: newLat, lng: newLng },
                        to
                    )));

                    if (step < steps) {
                        setTimeout(move, interval);
                    } else {
                        resolve();
                    }
                };

                move();
            });
        }

                const minutes = Math.floor((seconds % 3600) / 60);
                const rest = seconds % 60;
                if (hours > 0) {

            window.beginMapLoading = function(message) {

                state.active.set(token, message || 'Synchronizacja mapy...');
                clearTimeout(state.showTimer);
                clearTimeout(state.slowTimer);
                state.showTimer = setTimeout(() => {
                    const latest = Array.from(state.active.values()).pop();
                    if (latest) {
                        window.updateMapLoadingStatus(latest);
                    }
                }, 280);
                state.slowTimer = setTimeout(() => {
                    if (state.active.size > 0) {
                        window.updateMapLoadingStatus('Sieć przeciążona...');
                    }
                }, 2000);
                return token;
            };

            window.endMapLoading = function(token) {
                const state = window.mapLoadingState;
                if (token) {
                    state.active.delete(token);

                if (state.active.size > 0) {
                    const latest = Array.from(state.active.values()).pop();
                    if (state.visible && latest) {
                        window.updateMapLoadingStatus(latest);
                    }
                    return;
                }
                clearTimeout(state.showTimer);
                clearTimeout(state.slowTimer);
                if (state.element) {
                    state.element.classList.remove('is-visible');

            window.bootStep = async function(label, scope, fn, options = {}) {
                const state = window.mapBootState;
                const scopes = normalizeBootLoadedScopes();
                const silent = Boolean(options.silent);
                const total = Math.max(1, Number(options.total || 1));
                const index = Math.max(0, Number(options.index || 0));
                if (!silent) {
                    updateMapBootOverlay(label, Math.round((index / total) * 100));
                    await waitForMapBootPaint();
                }
                try {
                    if (typeof fn === 'function') {
                        const result = await fn();
                        if (result === false && options.critical) {
                            throw new Error(`Critical map scope failed: ${scope || label}`);
                        }
                    }
                    if (scope) {
                        scopes.add(scope);
                    }
                    if (!silent) {
                        updateMapBootOverlay(label, Math.round(((index + 1) / total) * 100));
                        await waitForMapBootPaint();
                    }
                    return true;
                } catch (err) {
                    console.warn('[map boot] step failed', scope || label, err);
                    if (options.critical) {
                        state.failed = true;
                        updateMapBootOverlay(`Blad ladowania: ${label}`, Math.round((index / total) * 100), true);
                        throw err;
                    }
                    return false;
                }
            };
