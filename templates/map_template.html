            window.removeIncidentHotspot = function(incidentId) {
                const id = String(incidentId || '').trim();
                if (!id || !window.incidentHotspotLayers || !window.incidentHotspotLayers[id]) return false;
                const entry = window.incidentHotspotLayers[id];
                (entry.layers || []).forEach(layer => removeMapLayerSafe(layer));
                delete window.incidentHotspotLayers[id];
                return true;
            };

            window.renderIncidentHotspot = function(incident) {
                if (!incident || typeof incident !== 'object') return false;
                const incidentId = String(incident.incident_id || incident.id || '').trim();
                const center = incident.center || {};
                const lat = parseFloat(center.lat);
                const lng = parseFloat(center.lng ?? center.lon);
                if (!incidentId || Number.isNaN(lat) || Number.isNaN(lng)) return false;

                const existing = window.incidentHotspotLayers && window.incidentHotspotLayers[incidentId];
                const nextVersion = Number(incident.version || 0);
                if (existing && nextVersion && Number(existing.version || 0) > nextVersion) {
                    return false;
                }
                window.removeIncidentHotspot(incidentId);

                const level = Math.max(1, Math.min(4, Number(incident.level || 1)));
                const radius = Math.max(60, Math.min(900, Number(incident.search_radius_m || 220)));
                const status = window.escapeMapText(incident.status || 'active');
                const label = `INCYDENT L${level}`;
                const colorByLevel = {
                    1: '#ffd34d',
                    2: '#ff9f2f',
                    3: '#ff4242',
                    4: '#ff1f1f'
                };
                const color = colorByLevel[level] || '#ff4242';

                const circle = L.circle([lat, lng], {
                    pane: 'incidentPane',
                    radius,
                    color,
                    fillColor: color,
                    fillOpacity: level >= 3 ? 0.16 : 0.10,
                    opacity: 0.78,
                    weight: level >= 3 ? 3 : 2,
                    dashArray: level >= 3 ? '6 5' : '3 6',
                    interactive: true
                }).addTo(map);

                const marker = L.marker([lat, lng], {
                    pane: 'incidentPane',
                    zIndexOffset: 760 + level,
                    icon: L.divIcon({
                        className: `incident-hotspot incident-hotspot--level-${level}`,
                        html: `
                            <div class="incident-hotspot__label">
                                <span>${label}</span>
                                <span class="incident-hotspot__level"> ${status}</span>
                            </div>
                        `,
                        iconSize: [124, 26],
                        iconAnchor: [62, 13]
                    })
                }).addTo(map);

                const tooltip = `Incydent publiczny<br>Poziom: ${level}<br>Status: ${status}<br>Promien: ${Math.round(radius)} m`;
                circle.bindTooltip(tooltip, { sticky: true, opacity: 0.95 });
                marker.bindTooltip(tooltip, { sticky: true, opacity: 0.95 });

                window.incidentHotspotLayers[incidentId] = {
                    id: incidentId,
                    version: nextVersion,
                    incident: { ...incident },
                    layers: [circle, marker]
                };
                return true;
            };

            window.refreshIncidentHotspots = async function() {
                const loadingToken = window.beginMapLoading('Synchronizacja incydentow...');
                try {
                    const snapshot = await window.fetchMapSnapshot('incidents', '/api/map/incidents', { timeoutMs: 10000 });
                    if (snapshot.skipped || snapshot.aborted) return false;
                    const res = snapshot.res;
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return false;
                    }
                    if (!res.ok) return false;
                    const data = await res.json();
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();
                    Object.keys(window.incidentHotspotLayers || {}).forEach(id => window.removeIncidentHotspot(id));
                    (data.incidents || []).forEach(incident => window.renderIncidentHotspot(incident));
                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                    return true;
                } catch (err) {
                    console.warn('Incident hotspot refresh failed', err);
                    return false;
                } finally {
                    window.endMapLoading(loadingToken);
                }
            };

            window.applyIncidentDelta = function(event) {
                const payload = (event && event.payload) || {};
                const type = String((event && event.type) || payload.type || '');
                const incidentId = String(
                    (event && event.entity_id)
                    || payload.incident_id
                    || payload.id
                    || ''
                ).trim();
                if (!incidentId) return false;
                if (type === 'incident.resolved' || payload.removed || payload.status === 'resolved') {
                    return window.removeIncidentHotspot(incidentId);
                }
                if (type === 'incident.created' || type === 'incident.updated' || event.scope === 'incident') {
                    return window.renderIncidentHotspot({
                        ...payload,
                        incident_id: payload.incident_id || incidentId
                    });
                }
                return false;
            };

                    ? element.getBoundingClientRect()
                    : null;
                const originalEvent = e && e.originalEvent;

                if (!rect || !originalEvent
                    || originalEvent.clientX < rect.left
                    || originalEvent.clientX > rect.right
                    || originalEvent.clientY < rect.top
                    || originalEvent.clientY > rect.bottom) {
                    return false;

            window.upsertPlayerActorMarker = function(actor) {

            window.playerAreaLayers = [];

            window.mapRefreshTimers = window.mapRefreshTimers || [];
            window.mapRefreshState = window.mapRefreshState || {
                inFlight: {},
                controllers: {},
                paused: false,
                pauseReason: '',
                resumeTimer: null
            };

                window.mapRefreshTimers.forEach(timer => {

            window.scheduleMapSnapshotRefresh = function(fn, intervalMs, initialDelayMs = 0) {
                const startTimer = setTimeout(() => {
                    if (typeof fn === 'function') fn();
                    const intervalTimer = setInterval(fn, intervalMs);
                    window.mapRefreshTimers.push(intervalTimer);
                }, Math.max(0, Number(initialDelayMs || 0)));
                window.mapRefreshTimers.push(startTimer);
                return startTimer;
            };

            window.abortMapOptionalRefreshes = function(reason = '') {
                const state = window.mapRefreshState || {};
                Object.entries(state.controllers || {}).forEach(([scope, controller]) => {
                    if (controller && typeof controller.abort === 'function') {
                        try {
                            controller.abort();
                        } catch (err) {
                            console.warn('[map refresh] abort failed', scope, err);
                        }
                    }
                });
            };

            window.pauseMapOptionalRefresh = function(reason = 'map_action') {
                const state = window.mapRefreshState;
                if (!state) return;
                state.paused = true;
                state.pauseReason = reason;
                if (state.resumeTimer) {
                    clearTimeout(state.resumeTimer);
                    state.resumeTimer = null;
                }
                window.abortMapOptionalRefreshes(reason);
            };

            window.resumeMapOptionalRefresh = function(delayMs = 1200) {
                const state = window.mapRefreshState;
                if (!state) return;
                if (state.resumeTimer) clearTimeout(state.resumeTimer);
                state.resumeTimer = setTimeout(() => {
                    state.paused = false;
                    state.pauseReason = '';
                    state.resumeTimer = null;
                }, Math.max(0, Number(delayMs || 0)));
            };

            window.fetchMapSnapshot = async function(scope, url, options = {}) {
                const state = window.mapRefreshState;
                const scopeKey = String(scope || 'map');
                const isCriticalBoot = Boolean(options.critical || (window.mapBootState && window.mapBootState.loading && !window.mapBootState.ready));
                if (!isCriticalBoot && state.paused) {
                    return { skipped: true, reason: state.pauseReason || 'paused' };
                }
                if (state.inFlight[scopeKey]) {
                    return { skipped: true, reason: 'in_flight' };
                }

                const controller = new AbortController();
                const timeoutMs = Math.max(1000, Number(options.timeoutMs || 12000));
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                state.inFlight[scopeKey] = true;
                state.controllers[scopeKey] = controller;

                try {
                    const res = await fetch(url, { signal: controller.signal });
                    return { res };
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        return { aborted: true, reason: state.pauseReason || 'aborted' };
                    }
                    throw err;
                } finally {
                    clearTimeout(timeoutId);
                    delete state.inFlight[scopeKey];
                    if (state.controllers[scopeKey] === controller) {
                        delete state.controllers[scopeKey];
                    }
                }
            };

                    (data.vulnerabilities || []).forEach(report => {
                        const target = report.target || {};
                        const lat = parseFloat(report.lat || target.lat);
                        const lng = parseFloat(report.lng || target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const markerTarget = normalizeMapMenuTarget({

                            lat,

                            generated: Boolean(report.generated || target.generated),

                                target: markerTarget

                                markerTarget.label,

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {

            window.requestTerritorySnapshotRecovery = function(reason = 'territory_delta_recovery') {
                if (window.territoryRecoveryTimer) {

            window.applyTerritoryDelta = function(event) {
                const payload = (event && event.payload) || {};
                const type = String((event && event.type) || payload.type || '');

                if (type === 'territory.conflict_changed') {
                    window.requestTerritorySnapshotRecovery('territory_conflict_changed');
                    return true;
                }

                if (type !== 'territory.updated' && event && event.scope !== 'territory') {
                    return false;
                }

                const territoryId = String(
                    (event && event.entity_id)
                    || payload.territory_id
                    || payload.area_id
                    || ''
                ).trim();
                if (!territoryId) return false;

                const entry = window.territoryAreaLayers && window.territoryAreaLayers[territoryId];
                if (!entry || !entry.layer) {
                    window.requestTerritorySnapshotRecovery('missing_territory_layer');
                    return false;
                }

                const previous = entry.area || {};
                const nextArea = {
                    ...previous,
                    ...payload,
                    id: payload.area_id || previous.id,
                    territory_id: territoryId,
                    owner_username: payload.owner_username || payload.owner_id || previous.owner_username,
                    area_size: payload.area_size !== undefined ? payload.area_size : previous.area_size,
                    centroid_lat: (payload.centroid || {}).lat ?? previous.centroid_lat,
                    centroid_lng: (payload.centroid || {}).lng ?? previous.centroid_lng
                };
                entry.area = nextArea;
                entry.layer._chaosTerritorySnapshot = nextArea;
                if (typeof entry.layer.setStyle === 'function') {
                    entry.layer.setStyle(territoryLayerStyle(nextArea));
                }
                if (typeof entry.layer.bindTooltip === 'function') {
                    entry.layer.bindTooltip(territoryTooltip(nextArea), {
                        sticky: true,
                        opacity: 0.95
                    });
                }
                window.territoryAreaLayers[territoryId] = entry;
                return true;
            };

            window.refreshPlayerAreas = async function() {
                const refreshSeq = ++window.playerAreaRefreshSeq;
                const loadingToken = window.beginMapLoading('Synchronizacja mapy...');
                try {
                    const snapshot = await window.fetchMapSnapshot('player_areas', '/api/map/player-areas', { timeoutMs: 15000 });
                    if (snapshot.skipped || snapshot.aborted) return false;
                    const res = snapshot.res;
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return false;
                    }
                    if (!res.ok) return false;
                    const data = await res.json();
                    if (refreshSeq !== window.playerAreaRefreshSeq) return false;
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    cleanupLegacyPlayerAreaLayers();
                    clearLayerArray('playerAreaLayers');
                    clearLayerArray('areaIntruderLayers');
                    clearLayerArray('contestedTargetLayers');
                    clearLayerArray('conflictAreaLayers');
                    clearLayerArray('capturedConflictPillarLayers');
                    resetTerritoryLayerRegistries();

                    (data.areas || []).forEach(area => {
                        renderTerritoryAreaLayer(area);
                        return;
                        const points = (area.vertices || [])
                            .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                            .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
                        if (points.length < 3) return;
                        if (!isSaneTerritoryPolygon(points)) {
                            console.warn('[map] Pominieto podejrzane terytorium', area.owner_username, points);
                            return;
                        }

                        const isEncircled = area.status === 'encircled';
                        const color = isEncircled ? '#ffcc33' : (area.is_mine ? '#26ff6a' : '#ff4b4b');
                        const fillColor = isEncircled ? '#b88700' : (area.is_mine ? '#0aa83d' : '#b62020');
                        const polygon = registerLayerInArray('playerAreaLayers', L.polygon(points, {
                            pane: 'territoryPane',
                            color,
                            fillColor,
                            fillOpacity: isEncircled ? 0.26 : (area.is_mine ? 0.13 : 0.20),
                            weight: isEncircled ? 4 : (area.is_mine ? 2 : 3),
                            dashArray: isEncircled ? '4 5' : (area.is_mine ? null : '8 6'),
                            interactive: true
                        }));
                        polygon.addTo(map);
                        const owner = window.escapeMapText(area.owner_nick || area.owner_username || 'unknown');
                        const status = window.escapeMapText(area.status || 'active');
                        const size = Math.round(Number(area.area_size || 0));
                        const ownerNick = window.escapeMapText(area.owner_nick || area.owner_username || 'unknown');
                        const ownerUsername = window.escapeMapText(area.owner_username || 'unknown');
                        const ownerClan = window.escapeMapText(area.owner_clan || 'brak');
                        polygon.bindTooltip(`${area.is_mine ? 'Twoje pole' : 'Pole gracza'}: ${ownerNick}<br>Login: ${ownerUsername}<br>Klan: ${ownerClan}<br>Status: ${status}<br>Pow.: ${size} m²`, {
                            sticky: true,
                            opacity: 0.95
                        });
                    });

                    (data.conflict_areas || []).forEach(conflict => {
                        renderTerritoryConflictLayer(conflict);
                        return;
                        const intersections = conflict.intersections && conflict.intersections.length
                            ? conflict.intersections
                            : [conflict.intersection || []];
                        const participants = conflict.participants_display
                            ? window.escapeMapText(conflict.participants_display)
                            : (conflict.participant_names || conflict.participants || [])
                                .map(name => window.escapeMapText(name))
                                .join(', ');

                        intersections.forEach((intersection, index) => {
                            const points = (intersection || [])
                                .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                                .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
                            if (points.length < 3) return;
                            if (!isSaneTerritoryPolygon(points)) {
                                console.warn('[map] Pominieto podejrzany konflikt terytorium', conflict.id, points);
                                return;
                            }

                            const polygon = registerLayerInArray('conflictAreaLayers', L.polygon(points, {
                                pane: 'territoryPane',
                                color: '#ffb300',
                                fillColor: '#ff8a00',
                                fillOpacity: 0.18,
                                weight: 3,
                                dashArray: '3 5',
                                interactive: true
                            }));
                            polygon.addTo(map);

                            polygon.bindTooltip(`Konflikt terytorium<br>Uczestnicy: ${participants || 'brak'}<br>Strefa: ${index + 1}`, {
                                sticky: true,
                                opacity: 0.95
                            });
                        });
                    });

                    (data.contested_targets || []).forEach(target => {
                        const lat = parseFloat(target.lat);
                        const lng = parseFloat(target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const label = window.escapeMapText(target.label || target.name || 'Kolizja');
                        const owner = window.escapeMapText(target.owner_nick || target.owner_username || 'wrog');
                        const icon = target.icon || '🎯';
                        const markerTarget = normalizeMapMenuTarget({
                            ...target,
                            lat,
                            lng,
                            lon: lng,
                            target_mode: 'territory_contest',
                            contest_owner_username: target.owner_username,
                            label: target.label || target.name || 'Kolizja',
                            name: target.name || target.label || 'Kolizja',
                            icon
                        });
                        const marker = L.marker([lat, lng], {
                            zIndexOffset: 920,
                            icon: L.divIcon({
                                className: 'territory-contest-target',
                                html: `
                                    <div style="display:flex;flex-direction:column;align-items:center;transform:translateY(-10px);font-family:monospace;color:#ff4b4b;text-shadow:0 1px 2px #000;">
                                        <div style="font-size:10px;background:rgba(35,0,0,0.86);padding:1px 5px;border:1px solid #ff4b4b;margin-bottom:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</div>
                                        <div style="width:32px;height:32px;border-radius:50%;border:2px solid #ff4b4b;background:#210707;display:flex;align-items:center;justify-content:center;font-size:18px;">${window.escapeMapText(icon)}</div>
                                    </div>
                                `,
                                iconSize: [74, 62],
                                iconAnchor: [37, 56],
                                popupAnchor: [0, -48]
                            })
                        }).addTo(map);

                        marker.bindTooltip(`Punkt kolizyjny: ${label}<br>Wlasciciel: ${owner}`, { sticky: true });
                        marker.on('contextmenu', function(e) {
                            consumeMapContextEvent(e);
                            showHackingMenuForMarker(e.containerPoint.x, e.containerPoint.y, markerTarget, icon, markerTarget.label, 'contestedTargetMarker');
                        });
                        registerLayerInArray('contestedTargetLayers', marker);
                    });

                    (data.captured_conflict_pillars || []).forEach(item => {
                        const target = item.target || item;
                        const lat = parseFloat(target.lat);
                        const lng = parseFloat(target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const label = window.escapeMapText(target.label || target.name || 'Przejety filar');
                        const capturedBy = window.escapeMapText(item.captured_by || item.hacked_by || target.owner_username || 'unknown');
                        const previousOwner = window.escapeMapText(item.previous_owner || 'unknown');
                        const marker = L.circleMarker([lat, lng], {
                            pane: 'territoryPane',
                            radius: 10,
                            color: '#b8ff28',
                            fillColor: '#162a0a',
                            fillOpacity: 0.72,
                            weight: 3,
                            interactive: true
                        }).addTo(map);

                        marker.bindTooltip(`Przejety filar: ${label}<br>Nowy wlasciciel: ${capturedBy}<br>Poprzedni: ${previousOwner}`, {
                            sticky: true,
                            opacity: 0.95
                        });
                        registerLayerInArray('capturedConflictPillarLayers', marker);
                    });

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                    return true;
                } catch (err) {
                    console.warn('Player area refresh failed', err);
                    return false;
                } finally {
                    window.endMapLoading(loadingToken);
                }
            };

            const MAP_PLAYER_ACTORS_SNAPSHOT_INTERVAL_MS = 30000;
            const MAP_PLAYER_AREAS_SNAPSHOT_INTERVAL_MS = 20000;
            const MAP_CLAN_VULNERABILITIES_SNAPSHOT_INTERVAL_MS = 20000;
            const MAP_ACTIVE_OPERATIONS_SNAPSHOT_INTERVAL_MS = 15000;
        }



    `   📡 WiFi	📡 📶 🛜
        🏦 Bank	🏦 💰 🏛️
        🏧 Bankomat	🏧
        📡 Antena satelitarna	📡 🛰️
        🖥️ Serwer / Komputer	🖥️ 🗄️ 💾
        🚲 Rower	🚲
        ☠️ Czaszka i kości	☠️ 💀
    `

    // Obsługa zwykłych celów
    document.querySelectorAll('.marker-label').forEach(labelEl => {
        const lat = parseFloat(labelEl.dataset.lat);
        const lng = parseFloat(labelEl.dataset.lng);
        const label = labelEl.dataset.label || 'Cel';
        const icon = labelEl.dataset.icon || '🎯';

        // Nowe: dodatkowe dane jeśli są obecne
        const name = labelEl.dataset.name || label;
        const source_type = labelEl.dataset.sourceType || "manual";
        const generated = labelEl.dataset.generated === "true";
        const target_id = labelEl.dataset.targetId || "";
        const target_mode = labelEl.dataset.targetMode || null;
        const target_username = labelEl.dataset.targetUsername || "";
        const relation = labelEl.dataset.relation || "";
        const menuTarget = normalizeMapMenuTarget({
            target_id,
            lat,
            lon: lng,
            lng,
            label,
            icon,
            name,
            source_type,
            generated,
            target_mode,
            target_username,
            relation
        });
        registerTargetMarker(menuTarget, null, {
            source: 'domTargetMarker',
            layer_type: 'dom_target',
            element: labelEl
        });

        labelEl.addEventListener('contextmenu', e => {
            consumeMapContextEvent(e);
            showHackingMenuForMarker(e.pageX, e.pageY, menuTarget, icon, label, 'domTargetMarker');
        });
    });


    // Obsługa zhakowanych celów
    renderCurrentAimedTargetMarker();

    document.querySelectorAll('.marker-hacked').forEach(labelEl => {
        const lat = parseFloat(labelEl.dataset.lat);
        const lng = parseFloat(labelEl.dataset.lng);
        const label = labelEl.dataset.label || 'Cel';
        const icon = labelEl.dataset.icon || '🎯';

        // Dodaj listener bezpośrednio do labelEl (bo to już .marker-hacked)
        labelEl.addEventListener('contextmenu', e => {
            consumeMapContextEvent(e);
            showMenuForHacked(e.pageX, e.pageY, normalizeMapMenuTarget({ lat, lon: lng, lng, label, icon }), icon, label);
        });
    });




    if (typeof window.bootMapInitialState === 'function') {
        window.bootMapInitialState();
    }



    function addSystemMessage(type, title, text) {
        fetch('/add-system-message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                type: type,
                title: title,
                text: text
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.status === "success") {
            } else {
                console.warn("⚠️ Błąd dodawania wiadomości:", res.message || res.error);
            }
        })
        .catch(err => {
            console.error("❌ Błąd połączenia z serwerem", err);
        });
    }
    </script>
