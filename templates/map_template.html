<!DOCTYPE html>
<html lang="pl">
<head>

  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .context-menu {
      position: absolute;
      background: #f8f8f8;
      border: 1px solid rgb(102, 102, 102);
      color: #2a2a2a;
      font-family: monospace;
      font-size: 10px;
      z-index: 10000;
      border-radius: 5px;
      padding: 5px;
    }
    .context-menu div {
      padding: 5px 10px;
      cursor: pointer;
    }
    .context-menu div:hover {
      background: rgba(115, 115, 115, 0.5);
    }
    .context-menu div.disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .context-menu div.disabled:hover {
      background: transparent;
    }
    .context-menu div.player-action-disabled {
      opacity: 0.42;

    }
    .context-menu div.player-action-disabled:hover {

    .context-menu .player-action-reason {

      margin-top: 2px;
      max-width: 190px;
      white-space: normal;

      right: 14px;
      bottom: 14px;

      gap: 8px;

  </div>
  <div id="active-operations-panel" class="active-operations-panel is-empty" aria-live="polite"></div>
    <script>
        window.profileData = JSON.parse('{{ profile | tojson | safe }}');
    </script>

  {{ folium_js|safe }}

    <script>
        const map = window[Object.keys(window).find(k => k.startsWith("map_"))];
        let lastContextWasMarker = false;
        const targetLayerRegistry = new Map();
        let scanResultLayers = [];
        const clanVulnerabilityRegistry = new Map();
        const baseZoom = map.getZoom();
        let zoomReturnTimer = null;
        let zoomReturnInterval = null;
        let programmaticMapMove = false;
        window.activeOperationLayers = [];
        window.latestActiveOperations = [];

        function clearZoomReturn() {
            if (zoomReturnTimer) {
                clearTimeout(zoomReturnTimer);
                zoomReturnTimer = null;
            }
            if (zoomReturnInterval) {
                clearInterval(zoomReturnInterval);
                zoomReturnInterval = null;
            }
        }

        function scheduleZoomReturn() {
            if (programmaticMapMove || map.getZoom() >= baseZoom) return;
            clearZoomReturn();
            zoomReturnTimer = setTimeout(() => {
                zoomReturnInterval = setInterval(() => {
                    const currentZoom = map.getZoom();
                    if (currentZoom >= baseZoom) {
                        clearZoomReturn();
                        return;
                    }
                    programmaticMapMove = true;
                    map.setZoom(Math.min(baseZoom, currentZoom + 1), { animate: true });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 350);
                }, 650);
            }, 1000);
        }

        map.on('zoomend', scheduleZoomReturn);
        map.on('dragstart movestart zoomstart', () => {
            if (!programmaticMapMove) clearZoomReturn();
        });
        map.on('dragend moveend', scheduleZoomReturn);
        map.createPane('territoryPane');
        map.getPane('territoryPane').style.zIndex = 250;
        map.getPane('territoryPane').style.pointerEvents = 'auto';

        function targetLayerKey(lat, lng, label = "") {
            return `${Number(lat).toFixed(6)}:${Number(lng).toFixed(6)}:${label || ""}`;
        }

        function vulnerabilityTargetKey(target) {
            if (!target) return "";
            const lat = Number(target.lat);
            const lng = Number(target.lng !== undefined ? target.lng : target.lon);
            const label = String(target.label || target.name || "");
            if (Number.isNaN(lat) || Number.isNaN(lng)) return "";
            return `${lat.toFixed(5)}:${lng.toFixed(5)}:${label}`;
        }

        function refreshParentToolbarProfile() {
            try {
                if (window.parent && window.parent !== window && typeof window.parent.refreshToolbarProfile === 'function') {
                    window.parent.refreshToolbarProfile();
                }
            } catch (err) {
                // Parent toolbar refresh is optional.
            }
        }

        function findClanVulnerabilityForTarget(target) {
            const key = vulnerabilityTargetKey(target);
            return key ? clanVulnerabilityRegistry.get(key) : null;
        }

        function rememberTargetLayer(lat, lng, label, layer) {
            const key = targetLayerKey(lat, lng, label);
            const previous = targetLayerRegistry.get(key);
            if (previous && map.hasLayer(previous)) {
                map.removeLayer(previous);
            }
            targetLayerRegistry.set(key, layer);
            return layer;
        }

        function clearScanResultLayers() {
            scanResultLayers.forEach(layer => {
                if (map.hasLayer(layer)) map.removeLayer(layer);
            });
            scanResultLayers = [];
        }

        function rememberScanResultLayer(layer) {
            scanResultLayers.push(layer);
            return layer;
        }

        function removeScanResultForTarget(target) {
            const targetKey = vulnerabilityTargetKey(target);
            if (!targetKey) return;
            scanResultLayers = scanResultLayers.filter(layer => {
                const layerTarget = layer && layer._scanTarget;
                if (vulnerabilityTargetKey(layerTarget) !== targetKey) {
                    return true;
                }
                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
                return false;
            });
        }

        function getNearestScanTarget(containerPoint, fallbackTarget) {
            let best = null;
            scanResultLayers.forEach(layer => {
                if (!map.hasLayer(layer) || !layer.getLatLng || !layer._scanTarget) return;
                const point = map.latLngToContainerPoint(layer.getLatLng());
                const dx = point.x - containerPoint.x;
                const dy = point.y - containerPoint.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const generatedPenalty = layer._scanTarget.generated ? 10 : 0;
                const score = distance + generatedPenalty;
                if (!best || score < best.score) {
                    best = {
                        target: layer._scanTarget,
                        score,
                        distance
                    };
                }
            });

            if (best && best.distance <= 46) {
                return best.target;
            }
            return fallbackTarget;
        }

        function handleScanContextFromDomEvent(event) {
            if (!scanResultLayers.length) return false;

            const point = map.mouseEventToContainerPoint(event);
            const pickedTarget = getNearestScanTarget(point, null);
            if (!pickedTarget) return false;

            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) {
                event.stopImmediatePropagation();
            }

            document.querySelectorAll('.context-menu').forEach(el => el.remove());
            showMarkerContextMenu(point.x, point.y, pickedTarget, pickedTarget.icon, pickedTarget.label);
            lastContextWasMarker = true;
            return true;
        }

        function removeScanResultAt(lat, lng) {
            const wantedLat = Number(lat).toFixed(6);
            const wantedLng = Number(lng).toFixed(6);
            scanResultLayers = scanResultLayers.filter(layer => {
                if (!layer.getLatLng) return true;
                const pos = layer.getLatLng();
                const matches = Number(pos.lat).toFixed(6) === wantedLat && Number(pos.lng).toFixed(6) === wantedLng;
                if (matches && map.hasLayer(layer)) map.removeLayer(layer);
                return !matches;
            });
        }

        function removeContestedTargetAt(lat, lng) {
            const wantedLat = Number(lat).toFixed(6);
            const wantedLng = Number(lng).toFixed(6);
            if (!Array.isArray(window.contestedTargetLayers)) return;
            window.contestedTargetLayers = window.contestedTargetLayers.filter(layer => {
                if (!layer.getLatLng) return true;
                const pos = layer.getLatLng();
                const matches = Number(pos.lat).toFixed(6) === wantedLat && Number(pos.lng).toFixed(6) === wantedLng;
                if (matches && map.hasLayer(layer)) map.removeLayer(layer);
                return !matches;
            });
        }

        function hideDomTargetMarkers(lat, lng, label = "") {
            const wantedLat = Number(lat).toFixed(6);

                const elLat = Number(el.dataset.lat).toFixed(6);
                const elLng = Number(el.dataset.lng).toFixed(6);
                const labelMatches = !label || !el.dataset.label || el.dataset.label === label;
                if (elLat === wantedLat && elLng === wantedLng && labelMatches) {
                    const markerEl = el.closest('.leaflet-marker-icon');
                    if (markerEl) markerEl.style.display = 'none';
                }

        function isMissingTargetDisplayName(value) {
            const normalized = String(value || '').trim().toLowerCase();
            return !normalized || ['brak nazwy', 'brak_nazwy', 'no name', 'unnamed', 'unnamed target', 'unknown', 'none', 'null', 'nieznany obiekt'].includes(normalized);
        }

        function targetDisplayCode(obj = {}) {
            const seed = [
                obj.osm_id,
                obj.node_id,
                obj.id,
                obj.lat,
                obj.lng ?? obj.lon,
                obj.source_type,
                obj.target_type,
                obj.procedural_seed
            ].filter(value => value !== undefined && value !== null && String(value).trim() !== '').join('|') || JSON.stringify(obj);
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16).toUpperCase().padStart(6, '0').slice(0, 6);
        }

        function targetDisplayPrefix(obj = {}) {
            const sourceType = String(obj.source_type || '').toLowerCase();
            const targetType = String(obj.target_type || '').toLowerCase();
            if (targetType === 'vehicle' || sourceType === 'car' || sourceType === 'vehicle') return 'ECU';
            if (targetType === 'person' || targetType === 'player' || sourceType === 'person' || sourceType === 'player') return 'SUBJECT';
            if (targetType === 'phone' || sourceType === 'phone') return 'DEVICE';
            if (targetType === 'camera' || sourceType === 'camera') return 'CAM';
            if (targetType === 'atm' || sourceType === 'atm') return 'ATM';
            if (['router', 'server'].includes(targetType) || ['router', 'server', 'hotspot'].includes(sourceType)) return 'NET';
            if (['shop', 'amenity', 'restaurant', 'bar', 'cafe', 'fast_food', 'parking', 'office'].includes(sourceType)) return 'NODE';
            if (targetType === 'poi') return 'POI';
            return 'TARGET';
        }

        function mapTargetDisplayLabel(obj = {}, fallbackPrefix = null) {
            for (const key of ['display_label', 'label', 'name', 'title']) {
                if (!isMissingTargetDisplayName(obj[key])) return String(obj[key]).trim();
            }
            return `${fallbackPrefix || targetDisplayPrefix(obj)}-${targetDisplayCode(obj)}`;
        }

                    if (typeof opener === 'function') {
                        opener(data);

                        addSystemMessage("warning", "🛠️ Narzędzia", "Otwórz Pliki i wybierz narzędzie z /tools.");

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                const message = data.message || (data.success ? 'Podatnosc wystawiona.' : 'Nie udalo sie wystawic podatnosci.');

                if (!res.ok || !data.success) {
                    addSystemMessage('warning', 'Podatnosc', message);
                    return;
                }

                addSystemMessage('success', 'Podatnosc', message);
                removeScanResultForTarget(target);
                if (data.report) {
                    const reportTarget = data.report.target || target;
                    const registryTarget = {
                        ...reportTarget,
                        vulnerability_id: data.report.id,
                        lat: Number(data.report.lat || reportTarget.lat || target.lat),
                        lng: Number(data.report.lng || reportTarget.lng || reportTarget.lon || target.lng || target.lon),
                        lon: Number(data.report.lng || reportTarget.lng || reportTarget.lon || target.lng || target.lon),
                        label: data.report.label || reportTarget.label || target.label,
                        name: data.report.name || reportTarget.name || target.name,
                        icon: data.report.icon || reportTarget.icon || target.icon,
                        source_type: data.report.source_type || reportTarget.source_type || target.source_type,
                        generated: Boolean(data.report.generated || reportTarget.generated || target.generated),
                        security: data.report.security || reportTarget.security || {}
                    };
                    const registryKey = vulnerabilityTargetKey(registryTarget);
                    if (registryKey) {
                        clanVulnerabilityRegistry.set(registryKey, {
                            ...data.report,
                            is_reporter: Boolean(data.report.is_reporter),
                            target: registryTarget
                        });
                    }
                }
                if (window.refreshClanVulnerabilities) {
                    window.refreshClanVulnerabilities();
                }

                lastContextWasMarker = false;

                    return;
                }

                addSystemMessage('success', 'Podatnosc', message);
                if (data.report) {

                        clanVulnerabilityRegistry.delete(registryKey);

        };

        function getBikeDirection(from, to) {
            const dx = to.lng - from.lng;
            const dy = to.lat - from.lat;
            if (Math.abs(dx) < 0.000001 && Math.abs(dy) < 0.000001) return "right";

            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angle >= -22.5 && angle < 22.5) return "right";
            if (angle >= 22.5 && angle < 67.5) return "up_right";
            if (angle >= 67.5 && angle < 112.5) return "up";
            if (angle >= 112.5 && angle < 157.5) return "up_left";
            if (angle >= 157.5 || angle < -157.5) return "left";
            if (angle >= -157.5 && angle < -112.5) return "down_left";
            if (angle >= -112.5 && angle < -67.5) return "down";
            return "down_right";
        }

        function updateAvatarDirection(targetLatLng) {
            const marker = window.avatarMarkerRef;
            if (!marker || !targetLatLng) return;
            const current = marker.getLatLng();
            const direction = getBikeDirection(
                { lat: current.lat, lng: current.lng },
                { lat: targetLatLng.lat, lng: targetLatLng.lng }
            );
            if (window.avatarBikeDirection === direction) return;
            window.avatarBikeDirection = direction;
            marker.setIcon(buildBikeIcon(direction));
        }

        async function animateAvatarTravel(marker, from, to, duration = 2000) {
            window.avatarBikeDirection = null;
            marker.setIcon(buildBikeIcon(getBikeDirection(from, to)));
            return new Promise(resolve => {
                const steps = 60;
                const interval = duration / steps;
                let step = 0;

                const deltaLat = (to.lat - from.lat) / steps;
                const deltaLng = (to.lng - from.lng) / steps;

                const move = () => {
                    step++;
                    const newLat = from.lat + deltaLat * step;
                    const newLng = from.lng + deltaLng * step;
                    marker.setLatLng([newLat, newLng]);
                    marker.setIcon(buildBikeIcon(getBikeDirection(
                        { lat: newLat, lng: newLng },
                        to
                    )));

                    if (step < steps) {
                        setTimeout(move, interval);
                    } else {
                        resolve();
                    }
                };

                move();
            });
        }

                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'

                if (!value) return null;
                const raw = String(value);
                const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
                const time = new Date(normalized);
                return Number.isNaN(time.getTime()) ? null : time;
            };

            window.formatOperationDate = function(value) {
                const time = window.parseOperationTime(value);
                if (!time) return '-';
                return time.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            };

            window.formatRemainingTime = function(expiresAt) {
                const time = window.parseOperationTime(expiresAt);
                if (!time) return '--:--';
                const seconds = Math.max(0, Math.floor((time.getTime() - Date.now()) / 1000));
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const rest = seconds % 60;
                if (hours > 0) {
                    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;

                return `${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;

                    const target = operation.target || {};
                    const position = operation.current_position || target;
                    const lat = parseFloat(position.lat);
                    const lng = parseFloat(position.lng !== undefined ? position.lng : position.lon);
                    if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                                    <div class="active-operation-pin__timer">${remaining}</div>
                                </div>

                            iconAnchor: [36, 52],
                            popupAnchor: [0, -44]
                        })

                    marker.bindTooltip(`${window.escapeMapText(meta.label)}<br>${label}<br>${remaining}`, {

                        opacity: 0.95

            window.mapLoadingState = window.mapLoadingState || {
                active: new Map(),
                seq: 0,
                showTimer: null,
                slowTimer: null,
                visible: false,
                element: null,
                text: null
            };

            window.ensureMapLoadingStatus = function() {
                if (window.mapLoadingState.element) {
                    return window.mapLoadingState.element;
                }
                const status = document.createElement('div');
                status.className = 'chaos-map-sync-status';
                status.setAttribute('role', 'status');
                status.setAttribute('aria-live', 'polite');
                status.innerHTML = `
                    <span class="chaos-map-sync-status__spinner" aria-hidden="true"></span>
                    <span class="chaos-map-sync-status__text">Synchronizacja mapy...</span>
                `;
                document.body.appendChild(status);
                window.mapLoadingState.element = status;
                window.mapLoadingState.text = status.querySelector('.chaos-map-sync-status__text');
                return status;
            };

            window.updateMapLoadingStatus = function(message) {
                const status = window.ensureMapLoadingStatus();
                if (window.mapLoadingState.text) {
                    window.mapLoadingState.text.textContent = message || 'Synchronizacja mapy...';
                }
                status.classList.add('is-visible');
                window.mapLoadingState.visible = true;
            };

            window.beginMapLoading = function(message) {
                const state = window.mapLoadingState;
                const token = `map-load-${++state.seq}`;
                state.active.set(token, message || 'Synchronizacja mapy...');
                clearTimeout(state.showTimer);
                clearTimeout(state.slowTimer);
                state.showTimer = setTimeout(() => {
                    const latest = Array.from(state.active.values()).pop();
                    if (latest) {
                        window.updateMapLoadingStatus(latest);
                    }
                }, 280);
                state.slowTimer = setTimeout(() => {
                    if (state.active.size > 0) {
                        window.updateMapLoadingStatus('Sieć przeciążona...');
                    }
                }, 2000);
                return token;
            };

            window.endMapLoading = function(token) {
                const state = window.mapLoadingState;
                if (token) {
                    state.active.delete(token);
                }
                if (state.active.size > 0) {
                    const latest = Array.from(state.active.values()).pop();
                    if (state.visible && latest) {
                        window.updateMapLoadingStatus(latest);
                    }
                    return;
                }
                clearTimeout(state.showTimer);
                clearTimeout(state.slowTimer);
                if (state.element) {
                    state.element.classList.remove('is-visible');
                }
                state.visible = false;
            };

            window.refreshActiveOperations = async function() {

                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return;
                    }
                    if (!res.ok) return;
                    const data = await res.json();
                    const active = data.active_operations || [];
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    window.latestActiveOperations = active;
                    window.renderActiveOperationsPanel(active);
                    window.renderActiveOperationMarkers(active);

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                } catch (err) {
                    console.warn('Active operations refresh failed', err);
                } finally {
                    window.endMapLoading(loadingToken);
                }

            window.renderPlayerActors = function(actors) {
                const visible = new Set();

                (actors || []).forEach(actor => {
                    const key = actor.username || actor.nick;
                    const lat = parseFloat(actor.lat);
                    const lng = parseFloat(actor.lng);
                    if (!key || Number.isNaN(lat) || Number.isNaN(lng)) return;

                    visible.add(key);
                    const relationLabel = window.playerActorRelationLabels[actor.relation] || actor.relation || 'Gracz';
                    const popup = `${window.escapeMapText(actor.nick || key)}<br>${window.escapeMapText(relationLabel)}`;

                    if (!window.playerActorMarkers[key]) {
                        const marker = L.marker([lat, lng], { icon: window.buildPlayerActorIcon(actor) }).addTo(map);
                        marker.bindPopup(popup, { autoPan: false });
                        marker.on('contextmenu', function(e) {
                            e.originalEvent.preventDefault();
                            e.originalEvent.stopPropagation();
                            if (actor.target_status || (actor.context && actor.context.is_marked_target)) {
                                window.showPlayerActorHackMenu(actor, null, e.containerPoint.x, e.containerPoint.y);
                                return;
                            }
                            window.showPlayerActorMenu(actor, e.containerPoint.x, e.containerPoint.y);
                        });
                        window.playerActorMarkers[key] = marker;
                    } else {
                        window.playerActorMarkers[key].setLatLng([lat, lng]);
                        window.playerActorMarkers[key].setIcon(window.buildPlayerActorIcon(actor));
                        window.playerActorMarkers[key].bindPopup(popup, { autoPan: false });
                        window.playerActorMarkers[key].off('contextmenu');
                        window.playerActorMarkers[key].on('contextmenu', function(e) {
                            e.originalEvent.preventDefault();
                            e.originalEvent.stopPropagation();
                            if (actor.target_status || (actor.context && actor.context.is_marked_target)) {
                                window.showPlayerActorHackMenu(actor, null, e.containerPoint.x, e.containerPoint.y);
                                return;
                            }
                            window.showPlayerActorMenu(actor, e.containerPoint.x, e.containerPoint.y);
                        });
                    }
                });

                Object.keys(window.playerActorMarkers).forEach(key => {
                    if (!visible.has(key)) {
                        if (map.hasLayer(window.playerActorMarkers[key])) {
                            map.removeLayer(window.playerActorMarkers[key]);
                        }
                        delete window.playerActorMarkers[key];
                    }
                });
            };

            window.refreshPlayerActors = async function() {
                const loadingToken = window.beginMapLoading('Synchronizacja mapy...');
                try {
                    const res = await fetch('/api/map/player-actors');
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return;
                    }
                    if (!res.ok) return;
                    const data = await res.json();
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    window.renderPlayerActors(data.player_actors || []);

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                } catch (err) {
                    console.warn('Player actor refresh failed', err);
                } finally {
                    window.endMapLoading(loadingToken);
                }
            };

            window.refreshFriendMarkers = async function() {
                try {
                    const res = await fetch('/api/map/friends');
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return;
                    }
                    if (!res.ok) return;
                    const data = await res.json();
                    const visible = new Set();
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    (data.friends || []).forEach(friend => {
                        const key = friend.username || friend.nick;
                        const lat = parseFloat(friend.lat);
                        const lng = parseFloat(friend.lng);
                        if (!key || Number.isNaN(lat) || Number.isNaN(lng)) return;

                        visible.add(key);
                        if (!window.friendMarkers[key]) {
                            const marker = L.marker([lat, lng], { icon: window.buildFriendIcon(friend) }).addTo(map);
                            marker.bindPopup(`${window.escapeMapText(friend.nick || key)}<br>Znajomy`, { autoPan: false });
                            window.friendMarkers[key] = marker;
                        } else {
                            window.friendMarkers[key].setLatLng([lat, lng]);
                            window.friendMarkers[key].setIcon(window.buildFriendIcon(friend));
                        }
                    });

                    Object.keys(window.friendMarkers).forEach(key => {
                        if (!visible.has(key)) {
                            map.removeLayer(window.friendMarkers[key]);
                            delete window.friendMarkers[key];
                        }
                    });

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                } catch (err) {
                    console.warn('Friend marker refresh failed', err);
                }
            };

            window.playerAreaLayers = [];
            window.areaIntruderLayers = [];
            window.clanVulnerabilityLayers = [];
            window.contestedTargetLayers = [];
            window.conflictAreaLayers = [];
            window.capturedConflictPillarLayers = [];
            window.mapRefreshTimers = window.mapRefreshTimers || [];
            window.playerAreaRefreshSeq = 0;
            window.stopMapRefreshTimers = function() {
                window.mapRefreshTimers.forEach(timer => clearInterval(timer));
                window.mapRefreshTimers = [];
            };

            window.buildClanVulnerabilityIcon = function(report) {
                const icon = window.escapeMapText ? window.escapeMapText(report.icon || '!')
                    : (report.icon || '!');
                const label = window.escapeMapText ? window.escapeMapText(report.label || report.name || 'Podatnosc')
                    : (report.label || report.name || 'Podatnosc');

                return L.divIcon({
                    className: 'clan-vulnerability-icon',
                    html: `
                        <div class="clan-vulnerability-pin">
                            <div class="clan-vulnerability-pin__icon">${icon}</div>
                            <div class="clan-vulnerability-pin__tag">${label}</div>
                        </div>
                    `,
                    iconSize: [86, 56],
                    iconAnchor: [43, 45],
                    popupAnchor: [0, -40]
                });
            };

            window.refreshClanVulnerabilities = async function() {
                try {
                    const res = await fetch('/api/map/clan-vulnerabilities');
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return;
                    }
                    if (!res.ok) return;
                    const data = await res.json();
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    window.clanVulnerabilityLayers.forEach(layer => map.removeLayer(layer));
                    window.clanVulnerabilityLayers = [];
                    clanVulnerabilityRegistry.clear();

                    (data.vulnerabilities || []).forEach(report => {
                        const target = report.target || {};
                        const lat = parseFloat(report.lat || target.lat);
                        const lng = parseFloat(report.lng || target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const markerTarget = {
                            ...target,
                            vulnerability_id: report.id,
                            lat,
                            lng,
                            lon: lng,
                            label: report.label || target.label || target.name || 'Podatnosc',
                            name: report.name || target.name || report.label || 'Podatnosc',
                            icon: report.icon || target.icon || '!',
                            source_type: report.source_type || target.source_type || 'manual',
                            generated: Boolean(report.generated || target.generated),
                            security: report.security || target.security || {}
                        };
                        const registryKey = vulnerabilityTargetKey(markerTarget);
                        if (registryKey) {
                            clanVulnerabilityRegistry.set(registryKey, {
                                ...report,
                                target: markerTarget
                            });
                        }

                        const marker = L.marker([lat, lng], {
                            zIndexOffset: 850,
                            icon: window.buildClanVulnerabilityIcon(report)
                        }).addTo(map);

                        marker.bindTooltip(markerTarget.label, { permanent: false, direction: 'top' });
                        marker.on('contextmenu', function(e) {
                            e.originalEvent.preventDefault();
                            e.originalEvent.stopPropagation();
                            if (report.is_reporter) {
                                showVulnerabilityReporterMenu(e.containerPoint.x, e.containerPoint.y, report);
                                return;
                            }
                            showHackingMenuForMarker(
                                e.containerPoint.x,
                                e.containerPoint.y,
                                markerTarget,
                                markerTarget.icon,
                                markerTarget.label
                            );
                        });

                        window.clanVulnerabilityLayers.push(marker);
                    });

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                } catch (err) {
                    console.warn('Clan vulnerabilities refresh failed', err);
                }
            };

            window.refreshPlayerAreas = async function() {
                const refreshSeq = ++window.playerAreaRefreshSeq;
                const loadingToken = window.beginMapLoading('Synchronizacja mapy...');
                try {
                    const res = await fetch('/api/map/player-areas');
                    if (res.status === 401) {
                        stopMapRefreshTimers();
                        return;
                    }
                    if (!res.ok) return;
                    const data = await res.json();
                    if (refreshSeq !== window.playerAreaRefreshSeq) return;
                    const keepCenter = map.getCenter();
                    const keepZoom = map.getZoom();

                    window.playerAreaLayers.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                    window.playerAreaLayers = [];
                    window.areaIntruderLayers.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                    window.areaIntruderLayers = [];
                    window.contestedTargetLayers.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                    window.contestedTargetLayers = [];
                    window.conflictAreaLayers.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                    window.conflictAreaLayers = [];
                    window.capturedConflictPillarLayers.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                    window.capturedConflictPillarLayers = [];

                    (data.areas || []).forEach(area => {
                        const points = (area.vertices || [])
                            .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                            .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
                        if (points.length < 3) return;

                        const isEncircled = area.status === 'encircled';
                        const color = isEncircled ? '#ffcc33' : (area.is_mine ? '#26ff6a' : '#ff4b4b');
                        const fillColor = isEncircled ? '#b88700' : (area.is_mine ? '#0aa83d' : '#b62020');
                        const polygon = L.polygon(points, {
                            pane: 'territoryPane',
                            color,
                            fillColor,
                            fillOpacity: isEncircled ? 0.26 : (area.is_mine ? 0.13 : 0.20),
                            weight: isEncircled ? 4 : (area.is_mine ? 2 : 3),
                            dashArray: isEncircled ? '4 5' : (area.is_mine ? null : '8 6'),
                            interactive: true
                        }).addTo(map);
                        const owner = window.escapeMapText(area.owner_nick || area.owner_username || 'unknown');
                        const status = window.escapeMapText(area.status || 'active');
                        const size = Math.round(Number(area.area_size || 0));
                        polygon.bindTooltip(`${area.is_mine ? 'Twoje pole' : 'Pole gracza'}: ${owner}<br>Status: ${status}<br>Pow.: ${size} m²`, {
                            sticky: true,
                            opacity: 0.95
                        });
                        {
                            const ownerNick = window.escapeMapText(area.owner_nick || area.owner_username || 'unknown');
                            const ownerUsername = window.escapeMapText(area.owner_username || 'unknown');
                            const ownerClan = window.escapeMapText(area.owner_clan || 'brak');
                            polygon.bindTooltip(`${area.is_mine ? 'Twoje pole' : 'Pole gracza'}: ${ownerNick}<br>Login: ${ownerUsername}<br>Klan: ${ownerClan}<br>Status: ${status}<br>Pow.: ${size} mÂ˛`, {
                                sticky: true,
                                opacity: 0.95
                            });
                        }
                        window.playerAreaLayers.push(polygon);
                    });

                    (data.conflict_areas || []).forEach(conflict => {
                        const intersections = conflict.intersections && conflict.intersections.length
                            ? conflict.intersections
                            : [conflict.intersection || []];
                        const participants = conflict.participants_display
                            ? window.escapeMapText(conflict.participants_display)
                            : (conflict.participant_names || conflict.participants || [])
                                .map(name => window.escapeMapText(name))
                                .join(', ');

                        intersections.forEach((intersection, index) => {
                            const points = (intersection || [])
                                .map(vertex => [parseFloat(vertex.lat), parseFloat(vertex.lng)])
                                .filter(point => !Number.isNaN(point[0]) && !Number.isNaN(point[1]));
                            if (points.length < 3) return;

                            const polygon = L.polygon(points, {
                                pane: 'territoryPane',
                                color: '#ffb300',
                                fillColor: '#ff8a00',
                                fillOpacity: 0.18,
                                weight: 3,
                                dashArray: '3 5',
                                interactive: true
                            }).addTo(map);

                            polygon.bindTooltip(`Konflikt terytorium<br>Uczestnicy: ${participants || 'brak'}<br>Strefa: ${index + 1}`, {
                                sticky: true,
                                opacity: 0.95
                            });
                            window.conflictAreaLayers.push(polygon);
                        });
                    });

                    (data.contested_targets || []).forEach(target => {
                        const lat = parseFloat(target.lat);
                        const lng = parseFloat(target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const label = window.escapeMapText(target.label || target.name || 'Kolizja');
                        const owner = window.escapeMapText(target.owner_nick || target.owner_username || 'wrog');
                        const icon = target.icon || '🎯';
                        const markerTarget = {
                            ...target,
                            lat,
                            lng,
                            lon: lng,
                            target_mode: 'territory_contest',
                            contest_owner_username: target.owner_username,
                            label: target.label || target.name || 'Kolizja',
                            name: target.name || target.label || 'Kolizja',
                            icon
                        };
                        const marker = L.marker([lat, lng], {
                            zIndexOffset: 920,
                            icon: L.divIcon({
                                className: 'territory-contest-target',
                                html: `
                                    <div style="display:flex;flex-direction:column;align-items:center;transform:translateY(-10px);font-family:monospace;color:#ff4b4b;text-shadow:0 1px 2px #000;">
                                        <div style="font-size:10px;background:rgba(35,0,0,0.86);padding:1px 5px;border:1px solid #ff4b4b;margin-bottom:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</div>
                                        <div style="width:32px;height:32px;border-radius:50%;border:2px solid #ff4b4b;background:#210707;display:flex;align-items:center;justify-content:center;font-size:18px;">${window.escapeMapText(icon)}</div>
                                    </div>
                                `,
                                iconSize: [74, 62],
                                iconAnchor: [37, 56],
                                popupAnchor: [0, -48]
                            })
                        }).addTo(map);

                        marker.bindTooltip(`Punkt kolizyjny: ${label}<br>Wlasciciel: ${owner}`, { sticky: true });
                        marker.on('contextmenu', function(e) {
                            e.originalEvent.preventDefault();
                            e.originalEvent.stopPropagation();
                            showHackingMenuForMarker(e.containerPoint.x, e.containerPoint.y, markerTarget, icon, markerTarget.label);
                        });
                        window.contestedTargetLayers.push(marker);
                    });

                    (data.captured_conflict_pillars || []).forEach(item => {
                        const target = item.target || item;
                        const lat = parseFloat(target.lat);
                        const lng = parseFloat(target.lng || target.lon);
                        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

                        const label = window.escapeMapText(target.label || target.name || 'Przejety filar');
                        const capturedBy = window.escapeMapText(item.captured_by || item.hacked_by || target.owner_username || 'unknown');
                        const previousOwner = window.escapeMapText(item.previous_owner || 'unknown');
                        const marker = L.circleMarker([lat, lng], {
                            pane: 'territoryPane',
                            radius: 10,
                            color: '#b8ff28',
                            fillColor: '#162a0a',
                            fillOpacity: 0.72,
                            weight: 3,
                            interactive: true
                        }).addTo(map);

                        marker.bindTooltip(`Przejety filar: ${label}<br>Nowy wlasciciel: ${capturedBy}<br>Poprzedni: ${previousOwner}`, {
                            sticky: true,
                            opacity: 0.95
                        });
                        window.capturedConflictPillarLayers.push(marker);
                    });

                    programmaticMapMove = true;
                    map.setView(keepCenter, keepZoom, { animate: false });
                    setTimeout(() => {
                        programmaticMapMove = false;
                    }, 0);
                } catch (err) {
                    console.warn('Player area refresh failed', err);
                } finally {
                    window.endMapLoading(loadingToken);
                }
            };

            window.refreshPlayerActors();
            window.refreshPlayerAreas();
            window.refreshClanVulnerabilities();
            window.refreshActiveOperations();
            window.stopMapRefreshTimers();
            window.mapRefreshTimers.push(setInterval(window.refreshPlayerActors, 5000));
            window.mapRefreshTimers.push(setInterval(window.refreshPlayerAreas, 10000));
            window.mapRefreshTimers.push(setInterval(window.refreshClanVulnerabilities, 10000));
            window.mapRefreshTimers.push(setInterval(window.refreshActiveOperations, 10000));
        }



    `   📡 WiFi	📡 📶 🛜
        🏦 Bank	🏦 💰 🏛️
        🏧 Bankomat	🏧
        📡 Antena satelitarna	📡 🛰️
        🖥️ Serwer / Komputer	🖥️ 🗄️ 💾
        🚲 Rower	🚲
        ☠️ Czaszka i kości	☠️ 💀
    `

    // Obsługa zwykłych celów
    document.querySelectorAll('.marker-label').forEach(labelEl => {
        const parentEl = labelEl.closest('.leaflet-marker-icon');
        if (!parentEl) return;

        const lat = parseFloat(labelEl.dataset.lat);
        const lng = parseFloat(labelEl.dataset.lng);
        const label = labelEl.dataset.label || 'Cel';
        const icon = labelEl.dataset.icon || '🎯';

        // Nowe: dodatkowe dane jeśli są obecne
        const name = labelEl.dataset.name || label;
        const source_type = labelEl.dataset.sourceType || "manual";
        const generated = labelEl.dataset.generated === "true";
        const target_mode = labelEl.dataset.targetMode || null;
        const target_username = labelEl.dataset.targetUsername || "";
        const relation = labelEl.dataset.relation || "";

        parentEl.addEventListener('contextmenu', e => {
            e.preventDefault();
            e.stopPropagation();

            showHackingMenuForMarker(e.pageX, e.pageY, {
                lat: lat,
                lon: lng,
                label: label,
                icon: icon,
                name: name,
                source_type: source_type,
                generated: generated,
                target_mode: target_mode,
                target_username: target_username,
                relation: relation
            }, icon, label);
        });
    });


    // Obsługa zhakowanych celów
    document.querySelectorAll('.marker-hacked').forEach(labelEl => {
        const parentEl = labelEl.closest('.leaflet-marker-icon');
        if (!parentEl) return;

        const lat = parseFloat(labelEl.dataset.lat);
        const lng = parseFloat(labelEl.dataset.lng);
        const label = labelEl.dataset.label || 'Cel';
        const icon = labelEl.dataset.icon || '🎯';

        // Dodaj listener bezpośrednio do labelEl (bo to już .marker-hacked)
        labelEl.addEventListener('contextmenu', e => {
            e.preventDefault();
            e.stopPropagation();
            showMenuForHacked(e.pageX, e.pageY, { lat, lon: lng }, icon, label);
        });
    });




    function addSystemMessage(type, title, text) {
        fetch('/add-system-message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                type: type,
                title: title,
                text: text
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.status === "success") {
            } else {
                console.warn("⚠️ Błąd dodawania wiadomości:", res.message || res.error);
            }
        })
        .catch(err => {
            console.error("❌ Błąd połączenia z serwerem", err);
        });
    }
    </script>
