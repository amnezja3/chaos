{% extends "admin_base.html" %}
{% block content %}
<section id="narrative-panel" class="panel" data-locale="{{ ui_locale }}">
<h1 data-copy="title"></h1><p data-copy="intro"></p>
<p id="provider-status" role="status" aria-live="polite"></p>
<form id="provider-form" class="provider-form">
<label><span data-copy="primary"></span><select name="primary"><option value="ollama">Ollama</option><option value="mistral">Mistral API</option></select></label>
<label><span data-copy="model"></span><select name="model"><option value="">—</option></select></label>
<label><span data-copy="remote"></span><input name="remote_seconds" type="number" min="5" max="30" required></label>
<label><span data-copy="total"></span><input name="total_seconds" type="number" min="250" max="660" required></label>
<label><span data-copy="tokens"></span><input name="max_tokens" type="number" min="64" max="1024" required></label>
<label><span data-copy="budget"></span><input name="daily_token_budget" type="number" min="0" max="1000000000" required></label>
<button type="submit" data-copy="save"></button>
</form>
<div class="toolbar" id="provider-actions">
<button type="button" data-action="status" data-copy="refresh"></button>
<button type="button" data-action="models" data-copy="models"></button>
<button type="button" data-action="health" data-copy="health"></button>
<button type="button" data-action="probe" data-copy="probe"></button>
<button type="button" data-action="generate" data-copy="generate"></button>
</div>
<p id="provider-meta"></p><p id="provider-health" role="status"></p>
<h2 data-copy="history"></h2><div id="provider-calls" class="table-scroll"></div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/admin_narrative.js?v=155"></script>{% endblock %}
