<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title data-ghost-i18n="onboarding.title">CHAOS - Rejestracja operatora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/images/chaos_favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/entry_gate.css?v=156-7-3">
  <link rel="stylesheet" href="/static/css/onboarding_gate.css?v=156-7-2">
</head>
<body class="entry-page onboarding-page">
  {% include "_ghost_locale.html" %}
  <div id="installer">
    <div id="background-image" aria-hidden="true"></div>
    <audio id="onboarding-music" src="/static/mp3/onboarding_music.mp3" preload="auto" autoplay loop></audio>

    <div id="form-box">
      <header class="onboarding-header"><a class="onboarding-brand" href="/?login=1"><img src="/static/images/chaos_favicon.svg" alt="">CHAOS</a><nav class="entry-tabs"><a href="/?login=1" data-ghost-i18n="entry.submit">Zaloguj</a><span aria-current="page" data-ghost-i18n="entry.gate.create">Utwórz konto</span></nav><div class="onboarding-locale">
        <label><span data-ghost-i18n="locale.label">Język interfejsu</span> <select data-entry-locale aria-label="Polski / English"></select></label>
        <span data-ghost-i18n="locale.test_notice"></span>
        <span role="status" data-entry-locale-status></span>
      </div>
      </header>
      <ol class="onboarding-steps" id="onboarding-steps"></ol>
      <main id="step-content"></main>
      <div id="error-msg" role="alert"></div>
    </div>

    <div id="progress-bar" aria-hidden="true">
      <div id="progress-fill"></div>
    </div>
    <div id="progress-label">1/6</div>
  </div>

  <template id="onboarding-providers">{% with identity_provider_registration=true %}{% include "identity_provider_buttons.html" %}{% endwith %}</template>
  <script src="/static/js/register_scripts.js?v=156-7-2"></script>
  <script src="/static/js/AvatarSelector.js?v=153-3-2"></script>
  <script src="/static/js/ghost_i18n_entry.js?v=153-3-2"></script>
</body>
</html>
