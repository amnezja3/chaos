<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAOS</title>
  <link rel="icon" href="{{ url_for('static', filename='images/chaos_favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=browser-controls-2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/googleplex_news.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/googleplex_search.css') }}?v=googleplex-card-6">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/blacknet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_messenger.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ghost_radio.css') }}">
</head>
<body>
  <div id="boot-preloader" class="boot-preloader" aria-live="polite">
    <div class="boot-panel">
      <div class="boot-panel-title">ghost_init.pkg</div>
      <div class="boot-progress"><span id="boot-progress-fill"></span></div>
      <div id="boot-status">Ładowanie systemu...</div>
      <div class="boot-log" id="boot-log">sys_inst --run</div>
    </div>
  </div>
  <div id="desktop-icons"></div>
  <div id="system-toast-container"></div>

  <script id="operation-feedback-config" type="application/json">
    {{ operation_feedback_flags | tojson }}
  </script>
  <script id="provisional-app-launch-config" type="application/json">
    {{ provisional_app_launch_flags | tojson }}
  </script>
  <script id="session-generation-config" type="application/json">
    {{ session_generation | tojson }}
  </script>
  <script src="{{ url_for('static', filename='js/session_generation.js') }}?v=session-isolation-1"></script>
  <script src="{{ url_for('static', filename='js/game_sfx.js') }}?v=sfx-ghostnetwork-7"></script>
  <script src="{{ url_for('static', filename='js/ghost_radio.js') }}?v=radio-stream-5"></script>
  <script src="{{ url_for('static', filename='js/operation_feedback.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ghostnetwork_delta_client.js') }}?v=suite-cutover-1"></script>
  <script src="{{ url_for('static', filename='js/googleplex_news.js') }}?v=googleplex-news-1"></script>
  <script src="{{ url_for('static', filename='js/googleplex_search_presentation.js') }}?v=googleplex-search-1"></script>
  <script src="{{ url_for('static', filename='js/terminal.js') }}?v=session-isolation-1-googleplex-search-6-blacknet-cta-1"></script>
</body>
</html>
